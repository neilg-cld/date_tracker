// ---------- Cross-device sync (private GitHub Gist) ----------
// The whole dataset is kept as one JSON file in a private Gist. A personal
// access token with the "gist" permission is all it needs — no server, and the
// Gist's own revision history doubles as versioned backups.

const GIST_FILE = 'relationship-tracker-data.json';
const GIST_TAG = 'relationship-tracker: private data store (do not edit by hand)';

const Sync = {
  token() { try { return localStorage.getItem('rt:gh-token') || ''; } catch (e) { return ''; } },
  gistId() { try { return localStorage.getItem('rt:gist-id') || ''; } catch (e) { return ''; } },
  lastPull() { try { return localStorage.getItem('rt:last-pull') || ''; } catch (e) { return ''; } },
  configured() { return !!this.token(); },
  save(token, gistId) {
    try {
      localStorage.setItem('rt:gh-token', token);
      if (gistId) localStorage.setItem('rt:gist-id', gistId);
    } catch (e) { /* ignore */ }
  },
  markPulled(stamp) { try { localStorage.setItem('rt:last-pull', stamp || ''); } catch (e) {} },
  clear() {
    try {
      localStorage.removeItem('rt:gh-token');
      localStorage.removeItem('rt:gist-id');
      localStorage.removeItem('rt:last-pull');
    } catch (e) { /* ignore */ }
  },
};

async function ghFetch(path, options) {
  const token = Sync.token();
  if (!token) throw new Error('No sync token set');
  const res = await fetch('https://api.github.com' + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      ...(options && options.headers),
    },
  });
  if (res.status === 401) throw new Error('That token was rejected — check it was copied in full.');
  if (res.status === 403) throw new Error('GitHub refused the request. The token may lack the "gist" permission.');
  if (!res.ok) throw new Error('GitHub returned ' + res.status);
  return res.json();
}

// Find the app's existing gist for this account, or make one.
async function ghConnect() {
  const me = await ghFetch('/user');
  let id = Sync.gistId();
  if (!id) {
    const gists = await ghFetch('/gists?per_page=100');
    const found = (gists || []).find(g => g.description === GIST_TAG || (g.files && g.files[GIST_FILE]));
    if (found) id = found.id;
  }
  if (!id) {
    const created = await ghFetch('/gists', {
      method: 'POST',
      body: JSON.stringify({
        description: GIST_TAG,
        public: false,
        files: { [GIST_FILE]: { content: JSON.stringify({ updatedAt: '', people: [] }) } },
      }),
    });
    id = created.id;
  }
  Sync.save(Sync.token(), id);
  return { login: me.login, gistId: id };
}

async function ghPull() {
  const id = Sync.gistId();
  if (!id) return null;
  const gist = await ghFetch('/gists/' + id);
  const file = gist.files && gist.files[GIST_FILE];
  if (!file) return null;
  let content = file.content;
  // Gists over ~1MB come back truncated, with the full copy at raw_url.
  if (file.truncated && file.raw_url) {
    const raw = await fetch(file.raw_url);
    if (!raw.ok) throw new Error('Could not download the full sync file.');
    content = await raw.text();
  }
  if (!content) return null;
  const parsed = JSON.parse(content);
  return {
    updatedAt: parsed.updatedAt || '',
    device: parsed.device || '',
    people: Array.isArray(parsed.people) ? parsed.people.map(backfillPerson) : [],
  };
}

async function ghPush(people) {
  const id = Sync.gistId();
  if (!id) throw new Error('Not connected');
  const updatedAt = new Date().toISOString();
  await ghFetch('/gists/' + id, {
    method: 'PATCH',
    body: JSON.stringify({
      files: {
        [GIST_FILE]: {
          content: JSON.stringify({ updatedAt, device: deviceLabel(), people }),
        },
      },
    }),
  });
  Sync.markPulled(updatedAt);
  return updatedAt;
}

function deviceLabel() {
  const ua = (navigator && navigator.userAgent) || '';
  if (/Android/i.test(ua)) return 'Android phone';
  if (/iPhone|iPad/i.test(ua)) return 'iPhone/iPad';
  if (/Mac/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows PC';
  return 'this device';
}

// ---------- Storage adapter ----------
// Inside a Claude artifact, window.storage exists. Opened as a downloaded file
// in Chrome it does not — so fall back to IndexedDB (large capacity, needed for
// base64 photos), then localStorage, then memory as a last resort.

const DataStore = (() => {
  const hasArtifact = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  const hasIDB = typeof indexedDB !== 'undefined';
  const DB_NAME = 'relationship-tracker', STORE = 'kv';
  const mem = {};

  function openDb() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE); };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  function idbOp(mode, fn) {
    return openDb().then(db => new Promise((res, rej) => {
      const store = db.transaction(STORE, mode).objectStore(STORE);
      const req = fn(store);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }));
  }

  return {
    mode: hasArtifact ? 'artifact' : hasIDB ? 'device' : 'session',
    label: hasArtifact ? 'Claude artifact storage' : hasIDB ? 'this device (IndexedDB)' : 'this session only',
    async get(key) {
      if (hasArtifact) {
        try { return await window.storage.get(key, false); } catch (e) { return null; }
      }
      if (hasIDB) {
        try {
          const v = await idbOp('readonly', s => s.get(key));
          if (v !== undefined && v !== null) return { key, value: v };
        } catch (e) { /* fall through */ }
      }
      try {
        const v = localStorage.getItem('rt:' + key);
        if (v !== null) return { key, value: v };
      } catch (e) { /* ignore */ }
      return mem[key] !== undefined ? { key, value: mem[key] } : null;
    },
    async set(key, value) {
      mem[key] = value;
      if (hasArtifact) {
        try { return await window.storage.set(key, value, false); } catch (e) { return null; }
      }
      if (hasIDB) {
        try { await idbOp('readwrite', s => s.put(value, key)); return { key, value }; }
        catch (e) { /* fall through */ }
      }
      try { localStorage.setItem('rt:' + key, value); return { key, value }; }
      catch (e) { return null; }
    },
  };
})();

// ---------- Helpers ----------

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

function overallAvg(d) {
  const vals = [d.chemistry, d.connection, d.compatibility].filter(v => v > 0);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function personAvg(person) {
  const avgs = (person.dates || [])
    .filter(d => d.status === 'Completed')
    .map(overallAvg)
    .filter(v => v !== null);
  if (avgs.length === 0) return null;
  return avgs.reduce((a, b) => a + b, 0) / avgs.length;
}

const TODAY = () => new Date().toISOString().slice(0, 10);

function daysBetween(isoA, isoB) {
  const a = new Date(isoA + 'T00:00:00'), b = new Date(isoB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

// Most recent real-world activity: explicit contact log, a conversation entry,
// a completed date, or falling back to the day you met.
function lastActivity(person) {
  const candidates = [person.lastContact, person.dateMet]
    .concat((person.conversationLog || []).map(c => c.date))
    .concat((person.dates || []).filter(d => d.status !== 'Upcoming').map(d => d.date))
    .filter(Boolean);
  if (!candidates.length) return null;
  return candidates.sort().slice(-1)[0];
}

// The most recent thing to happen at all — a logged message, a date, a booked
// date coming up, or an explicit contact note. Used to order the home list.
function activityRank(person) {
  const dates = (person.dates || []).map(d => d.date).filter(Boolean);
  const candidates = [lastActivity(person), person.lastContact, ...dates].filter(Boolean);
  return candidates.sort().slice(-1)[0] || '';
}

// A read taken before the latest message or date no longer reflects reality.
function readIsStale(person) {
  const read = person.coachRead;
  if (!read || !read.generatedAt) return false;
  const latest = activityRank(person);
  return !!latest && latest > read.generatedAt;
}

// The recommendation trimmed to its first sentence, for the home card.
function briefNextStep(read) {
  if (!read || !read.recommendation) return '';
  const first = read.recommendation.split(/(?<=[.!?])\s+/)[0] || read.recommendation;
  return first.length > 120 ? first.slice(0, 117).trimEnd() + '…' : first;
}

function daysQuiet(person) {
  const last = lastActivity(person);
  if (!last) return null;
  return Math.max(0, daysBetween(last, TODAY()));
}

// Every upcoming date across everyone, soonest first.
function upcomingAcross(people) {
  const today = TODAY();
  const out = [];
  people.forEach(p => {
    (p.dates || []).forEach(d => {
      if (d.status === 'Upcoming' && d.date && d.date >= today) {
        out.push({ person: p, date: d, daysAway: daysBetween(today, d.date) });
      }
    });
  });
  return out.sort((a, b) => a.date.date.localeCompare(b.date.date));
}

function friendlyDay(iso) {
  const n = daysBetween(TODAY(), iso);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 7) return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'long' });
  return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
}

function dateLabelsForPerson(person) {
  const map = {};
  const eligible = (person.dates || []).filter(d => d.status === 'Completed' || d.status === 'Upcoming');
  eligible.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  eligible.forEach((d, i) => { map[d.id] = ordinal(i + 1) + ' date'; });
  return map;
}

// Migrate the old flat "dates-list" (one record per date event, with a name
// field) into person-centric records with nested date history.
function migrateFromFlatList(flat) {
  const groups = {};
  flat.forEach(d => {
    const key = (d.name || 'Unknown').trim();
    if (!groups[key]) groups[key] = [];
    const { name, rating, ...rest } = d;
    let chemistry = rest.chemistry, connection = rest.connection, compatibility = rest.compatibility;
    if (chemistry === undefined) {
      chemistry = rating || 0; connection = rating || 0; compatibility = rating || 0;
    }
    groups[key].push({ ...rest, chemistry, connection, compatibility, status: d.status || 'Completed' });
  });
  return Object.entries(groups).map(([name, dates]) => {
    dates.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    return {
      id: 'p-' + name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now() + Math.random().toString(36).slice(2, 6),
      name,
      meetingChannel: '',
      dateMet: dates[0]?.date || '',
      stage: 'Dating',
      notes: '', endReason: '', endDate: '', endNotes: '',
      photos: [], profilePhotoId: null, conversationLog: [],
      dates,
    };
  });
}

// Backfill fields added after initial release, for people saved by an earlier version.
function backfillPerson(p) {
  const out = {
    photos: [], profilePhotoId: null, conversationLog: [], phone: '', lastContact: '',
    dateSuggestions: [], dismissedDateKeys: [],
    ...p,
    profile: { ...emptyProfile(), ...(p.profile || {}) },
  };
  // Older photos were single low-res thumbnails; keep them working.
  out.photos = (out.photos || []).map(ph => ({ thumb: ph.thumb || ph.dataUrl, ...ph }));
  out.conversationLog = migrateConversationLog(out.conversationLog);
  return out;
}

// Earlier versions stored chat imports as entries containing split lists or a
// full transcript. Flatten them into the dated point timeline used now.
function migrateConversationLog(log) {
  const out = [];
  let n = 0;
  const add = (from, text, date, timeLabel) => {
    if (!text) return;
    n += 1;
    out.push({ id: 'c-legacy-' + n + '-' + Math.random().toString(36).slice(2, 5), from, point: String(text).trim(), date: date || null, timeLabel: timeLabel || null });
  };
  (log || []).forEach(entry => {
    if (!entry) return;
    if (entry.point) { out.push({ ...entry, from: entry.from === 'me' ? 'me' : 'she' }); return; }
    const d = entry.date || null;
    (entry.messages || []).forEach(m => add(m.from === 'me' ? 'me' : 'she', m.text, m.date || d, m.timestamp));
    (entry.theySaid || []).forEach(t => add('she', t, d));
    (entry.iSaid || []).forEach(t => add('me', t, d));
    if (!entry.messages && !entry.theySaid && !entry.iSaid && entry.summary) add('she', entry.summary, d);
  });
  out.sort((a, b) => (a.date || '9999-12-31').localeCompare(b.date || '9999-12-31'));
  return out;
}

function profileIsEmpty(profile) {
  if (!profile) return true;
  const hasField = PROFILE_FIELDS.some(([k]) => profile[k]);
  return !hasField && !profile.bio && !(profile.interests || []).length
    && !(profile.prompts || []).length && !(profile.socials || []).length;
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not load image'));
    img.src = url;
  });
}

// The vision API downsizes any image to roughly 1568px on its long edge. A tall
// scrolling screenshot therefore arrives unreadable. Slice it into panels that
// are close to square, each sent at full readable width, with a little overlap
// so nothing is lost across a cut.
const PANEL_MAX_ASPECT = 1.3;     // height / width per panel
const PANEL_OVERLAP = 0.06;       // fraction of panel height repeated
const PANEL_WIDTH_CAP = 1100;     // px sent to the API — legible, and a third of the memory of 1400
const MAX_PANELS = 14;

function sliceImageToPanels(imgEl) {
  const W = imgEl.naturalWidth, H = imgEl.naturalHeight;
  const idealPanelH = W * PANEL_MAX_ASPECT;
  let count = Math.max(1, Math.ceil(H / idealPanelH));
  if (count > MAX_PANELS) count = MAX_PANELS;
  const step = H / count;
  const overlapPx = step * PANEL_OVERLAP;
  const panels = [];
  for (let i = 0; i < count; i++) {
    const sy = Math.max(0, i * step - (i > 0 ? overlapPx : 0));
    const sy2 = Math.min(H, (i + 1) * step + (i < count - 1 ? overlapPx : 0));
    const sh = sy2 - sy;
    // A 540px-wide phone capture is small for reading badge text. Scale up to
    // 2x where there is headroom, but never past the point where the API would
    // downscale it again (roughly 1568px on the long edge).
    const scale = Math.min(2, PANEL_WIDTH_CAP / W, 1500 / sh);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(W * scale));
    canvas.height = Math.max(1, Math.round(sh * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, sy, W, sh, 0, 0, canvas.width, canvas.height);
    const encoded = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    canvas.width = 0; canvas.height = 0;   // release the backing store immediately
    panels.push({
      index: i + 1,
      base64: encoded,
      y0: sy / H,
      y1: sy2 / H,
    });
  }
  return panels;
}

// Crop a photo region at the source image's own resolution.
// Everything is kept at a modest viewing size to keep storage small. Only the
// photo picked as the profile shot at import time is also kept at full size.
const PHOTO_FULL_EDGE = 1600;   // profile photo only
const PHOTO_VIEW_EDGE = 700;    // normal stored size — fine on any phone screen
const THUMB_MAX_EDGE = 300;     // grid thumbnails

function cropCanvas(imgEl, sx, sy, sw, sh, maxEdge, quality) {
  const scale = Math.min(1, maxEdge / Math.max(sw, sh));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(sw * scale));
  canvas.height = Math.max(1, Math.round(sh * scale));
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

// region coords are fractions of a panel; convert to the full image and crop.
function cropPhotoFromPanel(imgEl, panel, region) {
  const W = imgEl.naturalWidth, H = imgEl.naturalHeight;
  const panelTop = panel.y0 * H, panelH = (panel.y1 - panel.y0) * H;
  const clamp01 = v => Math.min(1, Math.max(0, Number(v) || 0));
  const rx = clamp01(region.x), ry = clamp01(region.y);
  const rw = Math.min(1 - rx, Math.max(0, Number(region.width) || 0));
  const rh = Math.min(1 - ry, Math.max(0, Number(region.height) || 0));
  const sx = rx * W, sw = rw * W;
  const sy = panelTop + ry * panelH, sh = rh * panelH;
  if (sw < 40 || sh < 40) return null;   // too small to be a real photo
  return {
    dataUrl: cropCanvas(imgEl, sx, sy, sw, sh, PHOTO_VIEW_EDGE, 0.82),
    fullDataUrl: cropCanvas(imgEl, sx, sy, sw, sh, PHOTO_FULL_EDGE, 0.88),
    thumb: cropCanvas(imgEl, sx, sy, sw, sh, THUMB_MAX_EDGE, 0.7),
    width: Math.round(sw),
    height: Math.round(sh),
  };
}

function approxBytes(dataUrl) {
  return dataUrl ? Math.round(dataUrl.length * 0.75) : 0;
}

function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Point-level de-duplication. Re-importing a screenshot, or two screenshots that
// overlap where the scroll was cut, must not log the same thing twice.
function normaliseMsg(text) {
  return (text || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function pointKey(p) {
  return (p.from === 'me' ? 'm:' : 's:') + normaliseMsg(p.point || p.text);
}

function existingPointKeys(log) {
  const set = new Set();
  (log || []).forEach(p => set.add(pointKey(p)));
  return set;
}

function dedupePoints(incoming, knownKeys) {
  const seen = new Set();
  const kept = [];
  let dropped = 0;
  (incoming || []).forEach(p => {
    const text = (p && (p.point || p.text) || '').trim();
    if (!text || !normaliseMsg(text)) return;
    const from = p.from === 'me' ? 'me' : 'she';
    const key = pointKey({ from, point: text });
    if (knownKeys.has(key) || seen.has(key)) { dropped += 1; return; }
    seen.add(key);
    kept.push({ from, point: text, date: p.date || null, timeLabel: p.timeLabel || null });
  });
  return { kept, dropped };
}

// Undated lines inherit the last date seen above them in the same batch, so a
// screenshot with one day divider dates everything that follows it.
function forwardFillDates(points, fallbackDate) {
  let current = null;
  points.forEach(p => {
    if (p.date) current = p.date;
    else if (current) p.date = current;
  });
  // Anything before the first divider takes the earliest date we do know.
  const firstKnown = points.find(p => p.date);
  points.forEach(p => { if (!p.date) p.date = (firstKnown && firstKnown.date) || fallbackDate || null; });
  return points;
}

// Merge new points into the existing timeline in date order, keeping the
// relative order of anything sharing a date.
function mergeTimeline(existing, incoming) {
  const stamped = [
    ...(existing || []).map((p, i) => ({ p, order: i, batch: 0 })),
    ...incoming.map((p, i) => ({ p, order: i, batch: 1 })),
  ];
  stamped.sort((a, b) => {
    const da = a.p.date || '9999-12-31', db = b.p.date || '9999-12-31';
    if (da !== db) return da.localeCompare(db);
    if (a.batch !== b.batch) return a.batch - b.batch;
    return a.order - b.order;
  });
  return stamped.map(x => x.p);
}

// A meet-up spotted in a chat becomes a suggestion the user confirms, edits or
// dismisses. The answer is remembered so the same one is never offered twice.
function suggestionKey(ev) {
  return normaliseMsg([ev.date || ev.dayText || '', ev.venue || '', ev.activity || ''].join(' '));
}

function buildDateSuggestions(events, person, confirmedDate) {
  const dismissed = new Set(person.dismissedDateKeys || []);
  const existing = new Set((person.dates || []).map(d => normaliseMsg((d.date || '') + ' ' + (d.location || ''))));
  const seen = new Set();
  const out = [];
  (events || []).forEach(ev => {
    if (!ev) return;
    if (!ev.date && !ev.dayText && !ev.venue && !ev.activity) return;
    const key = suggestionKey(ev);
    if (!key || dismissed.has(key) || seen.has(key)) return;
    seen.add(key);
    const date = ev.date || resolveDayText(ev.dayText, confirmedDate) || '';
    if (existing.has(normaliseMsg(date + ' ' + (ev.venue || '')))) return;
    out.push({
      key,
      id: 'sug-' + Math.random().toString(36).slice(2, 8),
      date,
      dayText: ev.dayText || '',
      timeText: ev.timeText || '',
      venue: ev.venue || '',
      activity: ev.activity || '',
      status: ev.status || 'proposed',
      proposedBy: ev.proposedBy || null,
    });
  });
  return out;
}

// "Saturday" relative to the day the messages were sent.
function resolveDayText(dayText, fromDate) {
  if (!dayText) return null;
  const t = dayText.toLowerCase();
  const base = fromDate || TODAY();
  const names = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  const idx = names.findIndex(n => t.includes(n));
  if (idx === -1) {
    if (t.includes('tomorrow')) return shiftDate(base, 1);
    if (t.includes('today') || t.includes('tonight')) return base;
    return null;
  }
  const baseDay = new Date(base + 'T00:00:00').getDay();
  let delta = (idx - baseDay + 7) % 7;
  if (delta === 0) delta = 7;                 // "Saturday" said on a Saturday means the next one
  if (t.includes('next')) delta += 7;
  return shiftDate(base, delta);
}

function shiftDate(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0, 10);
}

// How closely two names match, for flagging a chat imported onto the wrong person.
function nameSimilarity(a, b) {
  const na = normaliseMsg(a), nb = normaliseMsg(b);
  if (!na || !nb) return 0;
  if (na === nb) return 1;
  const firstA = na.split(' ')[0], firstB = nb.split(' ')[0];
  if (firstA && firstA === firstB) return 0.9;
  if (na.includes(nb) || nb.includes(na)) return 0.8;
  return 0;
}

// Read one or more chat screenshots into a single payload. Deduplication happens
// at commit time, once the person it belongs to is known.
async function extractChatPayload(files, onProgress) {
  let points = [], summaryParts = [], phoneNumbers = [], markers = [];
  let contactName = null, matchedDate = null, appName = null, lowConfidence = false;
  let dateEvents = [];
  let n = 0;
  for (const file of files) {
    n += 1;
    if (onProgress && files.length > 1) onProgress('Reading screenshot ' + n + ' of ' + files.length + '…');
    const fields = await extractFromScreenshot(file, CONVERSATION_EXTRACT_PROMPT, 6000, mergeChatResults, onProgress);
    if (fields.summary) summaryParts.push(fields.summary);
    if (Array.isArray(fields.points)) points = points.concat(fields.points);
    if (Array.isArray(fields.phoneNumbers)) phoneNumbers = phoneNumbers.concat(fields.phoneNumbers);
    if (Array.isArray(fields.relativeDayMarkers)) markers = markers.concat(fields.relativeDayMarkers);
    if (!contactName && fields.contactName) contactName = String(fields.contactName).trim();
    if (!matchedDate && fields.matchedDate) matchedDate = String(fields.matchedDate).trim();
    if (!appName && fields.appName) appName = String(fields.appName).trim();
    if (fields.attributionConfidence === 'low') lowConfidence = true;
    if (Array.isArray(fields.dateEvents)) dateEvents = dateEvents.concat(fields.dateEvents);
  }
  return {
    points, summary: summaryParts.join(' '), phoneNumbers, contactName, matchedDate, appName, dateEvents,
    markers: Array.from(new Set(markers.filter(Boolean))),
    lowConfidence,
    needsDate: points.length > 0 && (markers.length > 0 || points.some(p => !p.date)),
  };
}

function mergeProfileDrafts(target, fields) {
  PROFILE_FIELDS.forEach(([k]) => {
    if (!target[k] && fields[k]) target[k] = String(fields[k]).trim();
  });
  if (fields.bio) target.bio = target.bio ? (target.bio + '\n' + fields.bio).trim() : String(fields.bio).trim();
  const pushUnique = (arr, vals) => {
    (vals || []).forEach(v => {
      const val = typeof v === 'string' ? v.trim() : v;
      if (!val) return;
      if (!arr.some(x => JSON.stringify(x).toLowerCase() === JSON.stringify(val).toLowerCase())) arr.push(val);
    });
  };
  pushUnique(target.interests, fields.interests);
  pushUnique(target.socials, fields.socials);
  (fields.prompts || []).forEach(p => {
    if (!p) return;
    const q = String(p.question || '').trim(), a = String(p.answer || '').trim();
    if (!q && !a) return;
    const dup = target.prompts.some(x =>
      normaliseMsg(x.question) === normaliseMsg(q) && normaliseMsg(x.answer) === normaliseMsg(a));
    if (!dup) target.prompts.push({ question: q, answer: a });
  });
  return target;
}

async function runProfileExtraction(files, onProgress) {
  const profile = emptyProfile();
  let name = null;
  const photos = [];
  let fileNo = 0;
  for (const file of files) {
    fileNo += 1;
    let imgEl = null, panels = null;
    try {
      imgEl = await loadImageEl(file);
      panels = sliceImageToPanels(imgEl);
      if (onProgress) onProgress(`Reading image ${fileNo} of ${files.length} (${panels.length} panel${panels.length === 1 ? '' : 's'})…`);
      const fields = await extractFromPanels(panels, PROFILE_EXTRACT_PROMPT, 4000, mergeProfileResults, onProgress);
      // The encoded panels are several megabytes; only the y bounds are needed
      // from here on, so drop the image data before cropping.
      panels.forEach(p => { p.base64 = null; });
      if (!name && fields.name) name = String(fields.name).trim();
      mergeProfileDrafts(profile, fields);
      const regions = Array.isArray(fields.photoRegions) ? fields.photoRegions : [];
      for (const region of regions.slice(0, 8)) {
        try {
          const panel = panels.find(p => p.index === Number(region.panel)) || panels[0];
          const cropped = cropPhotoFromPanel(imgEl, panel, region);
          if (cropped) {
            photos.push({
              id: 'ph-' + Date.now() + Math.random().toString(36).slice(2, 6),
              dataUrl: cropped.dataUrl,
              fullDataUrl: cropped.fullDataUrl,
              thumb: cropped.thumb,
              width: cropped.width,
              height: cropped.height,
              caption: (region.description || '').slice(0, 80),
            });
          }
        } catch (e) { /* skip bad region */ }
      }
    } finally {
      if (imgEl) { try { URL.revokeObjectURL(imgEl.src); } catch (e) {} imgEl.src = ''; }
      panels = null;
      // Give the browser a moment to reclaim before the next large image.
      await new Promise(r => setTimeout(r, 250));
    }
  }
  return { draft: profile, name, photos };
}

function friendlyExtractError(e) {
  if (e && e.code === 'NO_API_KEY') return 'Add your Anthropic API key in Settings before importing screenshots.';
  if (e && e.code === 'BAD_API_KEY') return 'That API key was rejected — check it in Settings.';
  if (e && e.code === 'API_FAILED') return e.message;
  return null; // caller supplies its own default message
}

function requireApiKey() {
  const apiKey = localStorage.getItem('anthropic-api-key');
  if (!apiKey) {
    const err = new Error('No API key set');
    err.code = 'NO_API_KEY';
    throw err;
  }
  return apiKey;
}

async function callVision(contentBlocks, maxTokens) {
  const apiKey = requireApiKey();
  let response;
  try {
    response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-5',
        max_tokens: maxTokens || 800,
        messages: [{ role: 'user', content: contentBlocks }],
      }),
    });
  } catch (netErr) {
    throw wrapApiError('Network request failed (' + String(netErr && netErr.message || netErr) + ')');
  }
  if (response.status === 401) {
    const err = new Error('Invalid API key');
    err.code = 'BAD_API_KEY';
    throw err;
  }
  if (!response.ok) {
    // Surface what the API actually said rather than a generic failure.
    let detail = '';
    try {
      const body = await response.json();
      detail = (body && body.error && (body.error.message || body.error.type)) || '';
    } catch (e) { /* non-JSON body */ }
    throw wrapApiError('API returned ' + response.status + (detail ? ': ' + detail : ''));
  }
  const data = await response.json();
  const text = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n');
  const truncated = data.stop_reason === 'max_tokens';
  let cleaned = text.replace(/```json|```/g, '').trim();
  const first = cleaned.indexOf('{');
  if (first > 0) cleaned = cleaned.slice(first);
  const last = cleaned.lastIndexOf('}');
  if (!truncated && last > 0) cleaned = cleaned.slice(0, last + 1);
  const parsed = parseLooseJson(cleaned);
  if (parsed && !truncated) return parsed;
  const err = wrapApiError(truncated
    ? 'The reply was cut short at the token limit.'
    : 'The reply was not valid JSON (' + (cleaned.slice(0, 60) || 'empty response') + '…)');
  err.code = truncated ? 'TRUNCATED' : 'BAD_JSON';
  err.partial = parsed || null;   // callers may salvage this if a retry also fails
  throw err;
}

// A reply cut off mid-object is often still usable — close what's open and
// salvage the fields that did arrive.
function parseLooseJson(text) {
  if (!text) return null;
  try { return JSON.parse(text); } catch (e) { /* try to repair */ }
  let t = text.trim().replace(/,\s*$/, '');
  const attempts = [];
  const quotes = (t.match(/(?:^|[^\\])"/g) || []).length;
  if (quotes % 2 === 1) t += '"';
  attempts.push(t + '}');
  attempts.push(t.replace(/,?\s*"[^"]*"\s*:\s*[^,}]*$/, '') + '}');
  attempts.push(t + ']}');
  attempts.push(t.replace(/,?\s*"[^"]*"?\s*$/, '') + '}');
  for (const a of attempts) {
    try {
      const v = JSON.parse(a);
      if (v && typeof v === 'object') return v;
    } catch (e) { /* next */ }
  }
  return null;
}

function wrapApiError(message) {
  const err = new Error(message);
  err.code = 'API_FAILED';
  try {
    localStorage.setItem('rt:last-api-error', JSON.stringify({ at: new Date().toISOString(), message }));
  } catch (e) { /* ignore */ }
  return err;
}

function panelBlocks(panels, total, prompt) {
  const blocks = [];
  panels.forEach(p => {
    blocks.push({ type: 'text', text: `Panel ${p.index} of ${total} (vertical ${Math.round(p.y0 * 100)}%–${Math.round(p.y1 * 100)}% of the full screenshot):` });
    blocks.push({ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: p.base64 } });
  });
  blocks.push({ type: 'text', text: prompt });
  return blocks;
}

// One call with every panel is best — the model sees the whole profile at once.
// If that fails (too many images, a truncated reply, a transient API error) fall
// back to reading three panels at a time and stitching the answers together.
async function extractFromPanels(panels, prompt, maxTokens, merge, onProgress) {
  const total = panels.length;
  try {
    return await callVision(panelBlocks(panels, total, prompt), maxTokens || 4000);
  } catch (err) {
    if (err.code === 'NO_API_KEY' || err.code === 'BAD_API_KEY') throw err;
    if (total <= 3) {
      if (err.partial) return err.partial;   // better than nothing on a single-panel read
      throw err;
    }
    if (onProgress) onProgress('First pass failed — rereading in sections…');
    const chunks = [];
    for (let i = 0; i < total; i += 3) chunks.push(panels.slice(i, i + 3));
    const results = [];
    let lastErr = null;
    for (let i = 0; i < chunks.length; i++) {
      if (onProgress) onProgress(`Reading section ${i + 1} of ${chunks.length}…`);
      try {
        results.push(await callVision(panelBlocks(chunks[i], total, prompt), maxTokens || 4000));
      } catch (e) { lastErr = e; }
    }
    if (!results.length) throw lastErr || err;
    return merge ? merge(results) : results[0];
  }
}

function mergeProfileResults(results) {
  const out = { photoRegions: [] };
  results.forEach(r => {
    Object.keys(r || {}).forEach(k => {
      if (k === 'photoRegions') return;
      const v = r[k];
      if (v === null || v === undefined || v === '') return;
      if (Array.isArray(v)) out[k] = (out[k] || []).concat(v);
      else if (!out[k]) out[k] = v;
    });
    if (Array.isArray(r && r.photoRegions)) out.photoRegions = out.photoRegions.concat(r.photoRegions);
  });
  return out;
}

function mergeChatResults(results) {
  const out = { points: [], phoneNumbers: [], relativeDayMarkers: [], summary: '' };
  results.forEach(r => {
    if (!r) return;
    if (Array.isArray(r.points)) out.points = out.points.concat(r.points);
    if (Array.isArray(r.phoneNumbers)) out.phoneNumbers = out.phoneNumbers.concat(r.phoneNumbers);
    if (Array.isArray(r.relativeDayMarkers)) out.relativeDayMarkers = out.relativeDayMarkers.concat(r.relativeDayMarkers);
    if (r.summary) out.summary = (out.summary + ' ' + r.summary).trim();
    ['contactName', 'appName', 'matchedDate'].forEach(k => { if (!out[k] && r[k]) out[k] = r[k]; });
  });
  return out;
}

// Single-image extraction (chat screenshots, date plans) — still panel-sliced so
// long conversations stay legible.
async function extractFromScreenshot(file, prompt, maxTokens, merge, onProgress) {
  requireApiKey();
  const imgEl = await loadImageEl(file);
  const panels = sliceImageToPanels(imgEl);
  try {
    return await extractFromPanels(panels, prompt, maxTokens, merge, onProgress);
  } finally {
    panels.forEach(p => { p.base64 = null; });
    try { URL.revokeObjectURL(imgEl.src); } catch (e) {}
    imgEl.src = '';
  }
}

const stageBadgeClass = {
  'Talking Stage': 'bg-sky-50 text-sky-800',
  'Dating': 'bg-emerald-50 text-emerald-800',
  'Relationship': 'bg-violet-50 text-violet-800',
  'Ended': 'bg-stone-200 text-stone-600',
};

// ---------- Status read (coach summary at the top of a profile) ----------

const COACH_PROMPT = `You are advising a confident, established man in his fifties on where one particular connection stands. Your advice blends the practical schools of Dan Bacon, Gary Gunn, Bobby Rio and Orion Taragan. Hold to that frame:
- He leads. He proposes, decides and moves things forward rather than waiting to be chosen.
- Investment is proportional. Enthusiasm is matched, not exceeded. Chasing, over-texting and seeking reassurance read as low value and kill attraction.
- Text exists to arrange meeting in person, not to sustain a pen-pal correspondence. Several days of chat with no date is itself the problem.
- Abundance, not scarcity. One woman going quiet is information, not a crisis.
- Warm and direct together. Not aloof, not needy — interested, and unembarrassed about it.

READ THE VIBE PROPERLY. Do not just describe what was said — judge what it means. Weigh:
- Reciprocity: does she ask him questions back, or only answer his? Are her lines as substantial as his, or noticeably shorter?
- Initiation: who starts conversations, who revives them after a lull, who last spoke. Him always going first is the clearest warning sign there is.
- Investment trend: is her engagement rising, flat, or cooling compared with earlier in the exchange?
- Concreteness: does she offer specifics — her plans, opinions, availability, things about her life — or keep it generic and safe?
- Meeting behaviour: has a meet-up been proposed, by whom, and did she engage with logistics or deflect? Vague enthusiasm without a date in the diary counts as a deflection.
- Warmth signals: teasing, humour returned, personal disclosure, forward references to seeing him. Politeness on its own is not interest.
Where signals conflict, say so rather than picking the flattering reading.

Respond with ONLY a JSON object, no other text, no markdown fences:
{
"vibe": string — three to five words naming the temperature of it, e.g. "Warm and genuinely mutual", "Polite but one-sided", "Cooling since the first date", "Too early to call".
"status": string — 3-4 sentences on where this actually stands, citing the specific evidence behind your vibe call: who is investing more, whether it has moved offline, how long it has been running, what has been agreed or dodged. Say plainly if it is going nowhere.
"recommendation": string — 2-3 sentences on the single next move, and why it works. Specific enough to act on today. If the move is a message, say what it needs to do; if the move is to stop investing, say that.
}
Judge only on the facts given — never invent a message, a date or a detail. If there is genuinely little to go on, say so rather than padding. No flattery, no hedging. Respond with the JSON object only.`;

// Signals worth measuring rather than leaving the model to eyeball.
function conversationSignals(person) {
  const log = person.conversationLog || [];
  if (!log.length) return null;
  const hers = log.filter(x => x.from === 'she').length;
  const dated = log.filter(x => x.date);
  const firstDate = dated.length ? dated[0].date : null;
  const lastDate = dated.length ? dated[dated.length - 1].date : null;
  const byDay = {};
  dated.forEach(x => { if (!byDay[x.date]) byDay[x.date] = []; byDay[x.date].push(x); });
  const openers = Object.values(byDay).map(day => day[0].from);
  const heOpened = openers.filter(f => f === 'me').length;
  return {
    total: log.length,
    hers,
    mine: log.length - hers,
    herShare: Math.round((hers / log.length) * 100),
    lastSpeaker: log[log.length - 1].from === 'me' ? 'him' : 'her',
    span: firstDate && lastDate ? daysBetween(firstDate, lastDate) : null,
    conversationDays: Object.keys(byDay).length,
    heOpened,
    sheOpened: openers.length - heOpened,
  };
}

function buildCoachContext(person) {
  const lines = [];
  const p = { ...emptyProfile(), ...(person.profile || {}) };
  lines.push('Name: ' + person.name);
  lines.push('Stage: ' + person.stage);
  if (person.meetingChannel) lines.push('Met through: ' + person.meetingChannel);
  if (person.dateMet) lines.push('Matched/connected: ' + person.dateMet + ' (' + daysBetween(person.dateMet, TODAY()) + ' days ago)');
  PROFILE_FIELDS.forEach(([k, label]) => { if (p[k]) lines.push(label + ': ' + p[k]); });
  if (p.currentLocation && p.location && normaliseMsg(p.currentLocation) !== normaliseMsg(p.location)
      && !normaliseMsg(p.currentLocation).includes(normaliseMsg(p.location))
      && !normaliseMsg(p.location).includes(normaliseMsg(p.currentLocation))) {
    lines.push('Note: her current location differs from where she lives — she may be away or travelling.');
  }
  if (p.interests.length) lines.push('Interests: ' + p.interests.join(', '));
  if (p.bio) lines.push('Her bio: ' + p.bio);
  p.prompts.forEach(pr => lines.push('Profile prompt — ' + (pr.question || 'prompt') + ': ' + pr.answer));
  if (person.notes) lines.push('My notes: ' + person.notes);

  const dates = [...(person.dates || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (!dates.length) lines.push('Dates: none yet — this has not moved offline.');
  dates.forEach((d, i) => {
    const bits = ['Date ' + (i + 1) + ' (' + d.status + ')', d.date || 'no date', d.location || ''];
    const avg = overallAvg(d);
    if (avg !== null) bits.push('rated ' + avg.toFixed(1) + '/5');
    if (d.outcome) bits.push('outcome: ' + d.outcome);
    if (d.notes) bits.push(d.notes);
    lines.push(bits.filter(Boolean).join(' — '));
  });

  const log = person.conversationLog || [];
  if (log.length) {
    const hers = log.filter(x => x.from === 'she').length;
    lines.push('Message log — ' + log.length + ' lines, ' + hers + ' from her, ' + (log.length - hers) + ' from me:');
    log.slice(-40).forEach(x => lines.push('  ' + (x.date || 'undated') + ' ' + (x.from === 'me' ? 'Me' : 'Her') + ': ' + x.point));
  } else {
    lines.push('No conversation logged.');
  }
  const sig = conversationSignals(person);
  if (sig) {
    lines.push('Measured signals: ' + sig.total + ' logged lines (' + sig.herShare + '% hers), '
      + 'exchanged across ' + sig.conversationDays + ' separate day(s)'
      + (sig.span !== null ? ' spanning ' + sig.span + ' days' : '')
      + '. He opened the conversation on ' + sig.heOpened + ' of those days, she opened on ' + sig.sheOpened
      + '. The last word was ' + (sig.lastSpeaker === 'him' ? 'his' : 'hers') + '.');
  }
  const quiet = daysQuiet(person);
  if (quiet !== null) lines.push('Days since last logged activity: ' + quiet);
  const next = (person.dates || []).find(d => d.status === 'Upcoming' && d.date >= TODAY());
  if (next) lines.push('Date already booked: ' + next.date + ' at ' + (next.location || 'venue TBC'));
  lines.push('Today is ' + TODAY() + '.');
  return lines.join('\n');
}

async function generateCoachSummary(person) {
  const body = buildCoachContext(person) + '\n\n' + COACH_PROMPT;
  let result;
  try {
    result = await callVision([{ type: 'text', text: body }], 2000);
  } catch (e) {
    if (e.code !== 'TRUNCATED' && e.code !== 'BAD_JSON') throw e;
    // Once more with more room and an explicit brevity instruction.
    try {
      result = await callVision([{
        type: 'text',
        text: body + '\n\nKeep it tight: the whole reply must be under 200 words. Do not restate the facts back to me.',
      }], 3000);
    } catch (e2) {
      // Last resort: use the first attempt's partial, but only if it is complete
      // enough to be worth showing.
      const salvage = e2.partial || e.partial;
      if (salvage && salvage.status && salvage.recommendation) result = salvage;
      else throw e2;
    }
  }
  return {
    vibe: String(result.vibe || '').trim(),
    status: String(result.status || '').trim(),
    recommendation: String(result.recommendation || '').trim(),
    generatedAt: TODAY(),
  };
}

// ---------- Crash guard ----------
// A thrown render error would otherwise leave a blank white screen with no clue
// what happened. Catch it, show it, and let the app be restarted without losing
// saved data.

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    try {
      localStorage.setItem('rt:last-crash', JSON.stringify({
        at: new Date().toISOString(),
        message: String(error && error.message || error),
        stack: String((info && info.componentStack) || '').slice(0, 1200),
      }));
    } catch (e) { /* ignore */ }
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div className="min-h-screen bg-stone-100 text-stone-900 p-6">
        <div className="max-w-md mx-auto bg-white border border-red-200 rounded-lg p-4 mt-10">
          <h1 className="font-serif text-xl mb-2">Something broke</h1>
          <p className="text-sm text-stone-700">
            The app hit an error and stopped. Your saved people and photos are untouched — reloading will bring them back.
          </p>
          <pre className="mt-3 text-[11px] bg-stone-50 border border-stone-200 rounded p-2 overflow-x-auto whitespace-pre-wrap">
            {String(this.state.error && this.state.error.message || this.state.error)}
          </pre>
          <button onClick={() => window.location.reload()}
            className="mt-3 w-full bg-stone-900 text-white rounded-md py-2 text-sm font-medium">
            Reload
          </button>
        </div>
      </div>
    );
  }
}

function RelationshipTracker() {

  const [showProfileImport, setShowProfileImport] = useState(false);
  const [showChatImport, setShowChatImport] = useState(false);
  const [showSettings, setShowSettings] = useState(false);

  const [query, setQuery] = useState('');
  const [stageFilter, setStageFilter] = useState('Active');
  const [showInsights, setShowInsights] = useState(false);
  const [showProfileEdit, setShowProfileEdit] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [chatImport, setChatImport] = useState(null);
  const [notice, setNotice] = useState('');
  const [dateConfirm, setDateConfirm] = useState(null);
  const [backupNag, setBackupNag] = useState(false);
  const [syncState, setSyncState] = useState({ status: Sync.configured() ? 'idle' : 'off', last: Sync.lastPull(), error: '' });
  const [syncConflict, setSyncConflict] = useState(null);
  const pushTimer = React.useRef(null);
  const [coachBusy, setCoachBusy] = useState(false);
  const [coachError, setCoachError] = useState('');

  const [showDateForm, setShowDateForm] = useState(false);
  const [dateEditId, setDateEditId] = useState(null);
  const [dateForm, setDateForm] = useState(emptyDateForm);

  useEffect(() => { load().then(() => { if (Sync.configured()) pullFromCloud(true); }); }, []);

  async function load() {
    setLoading(true);
    try {
      const res = await DataStore.get('people-list');
      if (res && res.value) {
        setPeople(JSON.parse(res.value).map(backfillPerson));
      } else {
        // Try migrating from the old flat date log, if this account has one.
        // Otherwise start genuinely empty — no example/placeholder data.
        let migrated = null;
        try {
          const old = await DataStore.get('dates-list');
          if (old && old.value) migrated = migrateFromFlatList(JSON.parse(old.value));
        } catch (e) { /* no old data */ }
        const initial = migrated && migrated.length ? migrated : [];
        setPeople(initial);
        await DataStore.set('people-list', JSON.stringify(initial));
      }
    } catch (e) {
      setPeople([]);
      setError('Could not load your saved data.');
    }
    setLoading(false);
  }

  async function persist(next) {
    setPeople(next);
    try {
      const res = await DataStore.set('people-list', JSON.stringify(next));
      if (!res) setError('Save failed — changes may not persist.');
      else setError('');
    } catch (e) {
      setError('Save failed — changes may not persist.');
    }
    schedulePush(next);
  }

  // Push a few seconds after the last change, so a burst of edits is one upload.
  function schedulePush(next) {
    if (!Sync.configured() || !Sync.gistId()) return;
    if (pushTimer.current) clearTimeout(pushTimer.current);
    pushTimer.current = setTimeout(() => { pushToCloud(next); }, 2500);
  }

  async function pushToCloud(next) {
    if (!Sync.configured() || !Sync.gistId()) return;
    setSyncState(s2 => ({ ...s2, status: 'syncing', error: '' }));
    try {
      const stamp = await ghPush(next || peopleRef.current);
      setSyncState({ status: 'idle', last: stamp, error: '' });
    } catch (e) {
      setSyncState(s2 => ({ ...s2, status: 'error', error: String(e.message || e) }));
    }
  }

  // On startup, take whatever is newer. Mid-session, ask rather than clobber.
  async function pullFromCloud(atStartup) {
    if (!Sync.configured() || !Sync.gistId()) return;
    setSyncState(s2 => ({ ...s2, status: 'syncing', error: '' }));
    try {
      const remote = await ghPull();
      if (!remote) { setSyncState({ status: 'idle', last: Sync.lastPull(), error: '' }); return; }
      const localCount = peopleRef.current.length;
      const lastPull = Sync.lastPull();
      const remoteIsNewer = remote.updatedAt && (!lastPull || remote.updatedAt > lastPull);

      if (!remoteIsNewer) {
        // Nothing new up there — make sure our copy is the one on record.
        if (localCount) await pushToCloud(peopleRef.current);
        else setSyncState({ status: 'idle', last: lastPull, error: '' });
        return;
      }
      if (atStartup || !localCount) {
        setPeople(remote.people);
        await DataStore.set('people-list', JSON.stringify(remote.people));
        Sync.markPulled(remote.updatedAt);
        setSyncState({ status: 'idle', last: remote.updatedAt, error: '' });
        if (!atStartup) setNotice('Pulled ' + remote.people.length + ' people from sync.');
        return;
      }
      setSyncConflict({ remote, localCount });
      setSyncState({ status: 'idle', last: lastPull, error: '' });
    } catch (e) {
      setSyncState(s2 => ({ ...s2, status: 'error', error: String(e.message || e) }));
    }
  }

  async function resolveConflict(takeRemote) {
    const remote = syncConflict && syncConflict.remote;
    setSyncConflict(null);
    if (!remote) return;
    if (takeRemote) {
      setPeople(remote.people);
      await DataStore.set('people-list', JSON.stringify(remote.people));
      Sync.markPulled(remote.updatedAt);
      setSyncState({ status: 'idle', last: remote.updatedAt, error: '' });
      setNotice('Replaced with the synced copy (' + remote.people.length + ' people).');
    } else {
      await pushToCloud(peopleRef.current);
      setNotice('Kept this device and overwrote the synced copy.');
    }
  }

  async function connectSync(token) {
    Sync.save(token, '');
    setSyncState({ status: 'syncing', last: '', error: '' });
    try {
      const info = await ghConnect();
      const remote = await ghPull();
      if (remote && remote.people.length && !peopleRef.current.length) {
        setPeople(remote.people);
        await DataStore.set('people-list', JSON.stringify(remote.people));
        Sync.markPulled(remote.updatedAt);
        setNotice('Connected as ' + info.login + ' — pulled ' + remote.people.length + ' people.');
      } else if (remote && remote.people.length && peopleRef.current.length) {
        setSyncConflict({ remote, localCount: peopleRef.current.length });
        setNotice('Connected as ' + info.login + '.');
      } else {
        await ghPush(peopleRef.current);
        setNotice('Connected as ' + info.login + ' — this device is now the source.');
      }
      setSyncState({ status: 'idle', last: Sync.lastPull(), error: '' });
      return true;
    } catch (e) {
      setSyncState({ status: 'error', last: '', error: String(e.message || e) });
      return false;
    }
  }

  function disconnectSync() {
    Sync.clear();
    setSyncState({ status: 'off', last: '', error: '' });
    setNotice('Sync turned off on this device. Nothing was deleted.');
  }

  // Sequential imports fire in quick succession; always persist against the
  // latest list rather than a stale closure.
  const peopleRef = React.useRef(people);
  peopleRef.current = people;

  const selected = people.find(p => p.id === selectedId) || null;

  // ----- Person CRUD -----

  async function saveProfileDetails(draft) {

  async function swapConversationSpeakers() {

  // Overwrite refreshes the profile and adds the new photos, but never touches

  // ----- Conversation log (on the currently selected person) -----

    // Wrong person? Flag it before writing anything.
    const score = payload.contactName ? nameSimilarity(payload.contactName, selected.name) : 1;
    if (payload.contactName && score < 0.8) {
      const better = people
        .filter(p => p.id !== selected.id)
        .map(p => ({ person: p, score: nameSimilarity(payload.contactName, p.name) }))
