  // "Today"/"Yesterday" dividers can't be dated with certainty, so confirm.
  async function stageConversation(payload, targetId) {
    if (payload.needsDate) {
      setChatImport(null);
      setDateConfirm({ payload, targetId });
      return;
    }
    await commitConversation(payload, targetId, null);
  }

  async function commitConversation(payload, targetId, confirmedDate) {
    const target = peopleRef.current.find(p => p.id === targetId);
    if (!target) return { added: 0, dropped: 0 };
    setChatImport(null);
    setDateConfirm(null);
    // Deduplicate against whoever this is actually being filed under.
    const { kept, dropped } = dedupePoints(payload.points, existingPointKeys(target.conversationLog));
    if (!kept.length) {
      setError(dropped
        ? 'Everything in that screenshot was already logged for ' + target.name + ' — nothing new added.'
        : 'Nothing could be read from that screenshot.');
      return { added: 0, dropped };
    }
    const filled = forwardFillDates(kept.map(p => ({ ...p })), confirmedDate || TODAY()).map(p => ({
      id: 'c-' + Date.now() + Math.random().toString(36).slice(2, 6),
      app: payload.appName || '',
      ...p,
    }));
    const timeline = mergeTimeline(target.conversationLog || [], filled);
    const newPhone = (!target.phone && payload.phoneNumbers.length > 0) ? payload.phoneNumbers[0] : target.phone;
    const newMet = (!target.dateMet && payload.matchedDate) ? payload.matchedDate : target.dateMet;
    const newChannel = (!target.meetingChannel && payload.appName) ? payload.appName : target.meetingChannel;
    const lastDate = timeline.map(p => p.date).filter(Boolean).sort().slice(-1)[0] || TODAY();
    const suggestions = [
      ...(target.dateSuggestions || []),
      ...buildDateSuggestions(payload.dateEvents, target, confirmedDate || lastDate),
    ].filter((sug, i, arr) => arr.findIndex(x => x.key === sug.key) === i);
    await persist(peopleRef.current.map(p => p.id === targetId
      ? {
          ...p, conversationLog: timeline, phone: newPhone, dateMet: newMet,
          meetingChannel: newChannel, lastContact: lastDate,
          chatSummary: payload.summary || p.chatSummary || '',
          dateSuggestions: suggestions,
        }
      : p));
    setError('');
    setNotice(kept.length + ' line' + (kept.length === 1 ? '' : 's') + ' added to ' + target.name
      + (dropped ? ', ' + dropped + ' duplicate' + (dropped === 1 ? '' : 's') + ' skipped' : '') + '.'
      + (payload.lowConfidence ? ' Who-said-what was unclear — check it and use Swap if it\'s reversed.' : ''));
    return { added: kept.length, dropped };
  }

  async function acceptDateSuggestion(sug) {
    if (!selected) return;
    const isPast = sug.date && sug.date < TODAY();
    const entry = {
      id: 'd-' + Date.now() + Math.random().toString(36).slice(2, 5),
      location: sug.venue || sug.activity || 'TBC',
      date: sug.date || '',
      status: sug.status === 'cancelled' ? 'Cancelled' : sug.status === 'happened' || isPast ? 'Completed' : 'Upcoming',
      venues: sug.venue || '',
      chemistry: 0, connection: 0, compatibility: 0,
      outcome: '',
      notes: [sug.activity, sug.timeText ? 'Time: ' + sug.timeText : '', 'From chat import'].filter(Boolean).join(' — '),
    };
    await persist(peopleRef.current.map(p => p.id === selected.id
      ? {
          ...p,
          dates: [...(p.dates || []), entry],
          dateSuggestions: (p.dateSuggestions || []).filter(x => x.key !== sug.key),
          dismissedDateKeys: [...(p.dismissedDateKeys || []), sug.key],
        }
      : p));
    setNotice('Date added — ' + (sug.date || 'no date') + (sug.venue ? ', ' + sug.venue : '') + '.');
  }

  async function dismissDateSuggestion(sug) {
    if (!selected) return;
    await persist(peopleRef.current.map(p => p.id === selected.id
      ? {
          ...p,
          dateSuggestions: (p.dateSuggestions || []).filter(x => x.key !== sug.key),
          dismissedDateKeys: [...(p.dismissedDateKeys || []), sug.key],
        }
      : p));
    setNotice("Dismissed — that one won't be suggested again.");
  }

  // A chat with no profile behind it is someone met in person until told otherwise.
  async function createPersonForChat(name, payload) {
    const record = newPersonRecord({
      name: name.trim(),
      meetingChannel: payload.appName || 'In person',
      dateMet: payload.matchedDate || '',
      stage: 'Talking Stage',
      phone: payload.phoneNumbers[0] || '',
    });
    await persist([record, ...peopleRef.current]);
    return record.id;
  }

  async function deleteConversationEntry(entryId) {
    if (!selected) return;
    const nextLog = (selected.conversationLog || []).filter(c => c.id !== entryId);
    await persist(people.map(p => p.id === selected.id ? { ...p, conversationLog: nextLog } : p));
  }

  // ----- Date CRUD (nested under a person) -----

  function startAddDate() {
    setDateForm(emptyDateForm);
    setDateEditId('new');
    setShowDateForm(true);
  }
  function startEditDate(d) {
    setDateForm({ ...emptyDateForm, ...d });
    setDateEditId(d.id);
    setShowDateForm(true);
  }
  function cancelDateForm() {
    setShowDateForm(false);
    setDateEditId(null);
    setDateForm(emptyDateForm);
  }
  async function saveDateForm() {
    if (!dateForm.location.trim()) { setError('Location is required.'); return; }
    if (!selected) return;
    let nextDates;
    if (dateEditId === 'new') {
      const entry = { ...dateForm, id: 'd-' + Date.now() };
      nextDates = [entry, ...(selected.dates || [])];
    } else {
      nextDates = (selected.dates || []).map(d => d.id === dateEditId ? { ...dateForm, id: dateEditId } : d);
    }
    // Auto-advance a Talking Stage person to Dating only once a date is confirmed Completed —
    // Cancelled, No show, or still-Upcoming entries don't count as the date having happened.
    const nextStage = (selected.stage === 'Talking Stage' && dateForm.status === 'Completed')
      ? 'Dating' : selected.stage;
    await persist(people.map(p => p.id === selected.id ? { ...p, dates: nextDates, stage: nextStage } : p));
    cancelDateForm();
  }
  async function removeDate(id) {
    if (!selected) return;
    const nextDates = (selected.dates || []).filter(d => d.id !== id);
    await persist(people.map(p => p.id === selected.id ? { ...p, dates: nextDates } : p));
  }

  const sortedPeople = [...people].sort((a, b) => {
    // Active stages first, then Ended; within each, whatever moved most recently.
    const rank = s => s === 'Ended' ? 1 : 0;
    if (rank(a.stage) !== rank(b.stage)) return rank(a.stage) - rank(b.stage);
    return activityRank(b).localeCompare(activityRank(a));
  });

  const visiblePeople = sortedPeople.filter(p => {
    if (stageFilter === 'Active' && p.stage === 'Ended') return false;
    if (stageFilter !== 'Active' && stageFilter !== 'All' && p.stage !== stageFilter) return false;
    if (!query.trim()) return true;
    const q = query.trim().toLowerCase();
    return (p.name || '').toLowerCase().includes(q) || (p.meetingChannel || '').toLowerCase().includes(q);
  });

  const upcoming = useMemo(() => upcomingAcross(people), [people]);

  // Data lives only against this exact file. Prompt for a backup if there is
  // anything worth losing and none has been taken in the last week.
  useEffect(() => {
    if (loading || !people.length) { setBackupNag(false); return; }
    let last = null;
    try { last = localStorage.getItem('rt:last-export'); } catch (e) {}
    setBackupNag(!last || daysBetween(last, TODAY()) >= 7);
  }, [people, loading]);

  const knownChannels = useMemo(() => {
    const set = new Set(COMMON_CHANNELS);
    people.forEach(p => { if (p.meetingChannel) set.add(p.meetingChannel); });
    return Array.from(set);
  }, [people]);

  // ---------- Detail (single person) view ----------
  if (selected) {
    const labels = dateLabelsForPerson(selected);
    const sortedDates = [...(selected.dates || [])].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const avg = personAvg(selected);
    return (
      <div className="min-h-screen bg-stone-100 text-stone-900">
        <div className="max-w-2xl mx-auto px-4 py-8">
          <button onClick={() => setSelectedId(null)} className="flex items-center gap-1 text-sm text-stone-600 hover:text-stone-900 mb-4">
            <ChevronLeft className="w-4 h-4" /> All people
          </button>

          <div className="bg-white border border-stone-200 rounded-lg p-4 mb-4">
            <div className="flex items-start justify-between gap-3">
              <div className="flex items-start gap-3">
                {(() => {
                  const avatar = (selected.photos || []).find(ph => ph.id === selected.profilePhotoId) || (selected.photos || [])[0];
                  return avatar ? (
                    <img src={avatar.thumb || avatar.dataUrl} alt="" className="w-16 h-16 rounded-full object-cover border border-stone-200 shrink-0" />
                  ) : null;
                })()}
                <div>
                <div className="flex items-center gap-2 flex-wrap">
                  <h2 className="text-xl font-serif">{selected.name}</h2>
                  <span className={`text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full ${stageBadgeClass[selected.stage]}`}>
                    {selected.stage}
                  </span>
                </div>
                <div className="mt-1 text-sm text-stone-600 space-y-0.5">
                  {selected.meetingChannel && (
                    <div className="flex items-center gap-1.5"><MessageCircle className="w-3.5 h-3.5" /> Matched on {selected.meetingChannel}</div>
                  )}
                  {selected.dateMet && (
                    <div className="flex items-center gap-1.5"><Calendar className="w-3.5 h-3.5" /> Matched {selected.dateMet}</div>
                  )}
                  {selected.phone && (
                    <div className="flex items-center gap-1.5"><Phone className="w-3.5 h-3.5" /> {selected.phone}</div>
                  )}
                  {avg !== null && (
                    <div className="flex items-center gap-1.5 font-medium text-amber-600">
                      <Star className="w-3.5 h-3.5 fill-amber-500 text-amber-500" /> {avg.toFixed(1)} avg across {(selected.dates || []).filter(d => d.status === 'Completed').length} date(s)
                    </div>
                  )}
                </div>
                {selected.notes && <p className="mt-2 text-sm text-stone-700">{selected.notes}</p>}
                {selected.stage === 'Ended' && (
                  <div className="mt-2 text-sm text-stone-600 bg-stone-50 border border-stone-200 rounded-md p-2">
                    <div className="flex items-center gap-1.5 font-medium text-stone-800"><Flag className="w-3.5 h-3.5" /> {selected.endReason || 'Ended'}</div>
                    {selected.endDate && <div>Ended {selected.endDate}</div>}
                    {selected.endNotes && <div className="mt-1">{selected.endNotes}</div>}
                  </div>
                )}
                </div>
              </div>
              <div className="flex flex-col gap-1 shrink-0">
                <button onClick={() => startEditPerson(selected)} className="p-1.5 text-stone-500 hover:text-stone-900 rounded focus:outline-none focus:ring-2 focus:ring-stone-900">
                  <Pencil className="w-4 h-4" />
                </button>
                <button onClick={() => removePerson(selected.id)} className="p-1.5 text-stone-500 hover:text-red-700 rounded focus:outline-none focus:ring-2 focus:ring-stone-900">
                  <Trash2 className="w-4 h-4" />
                </button>
              </div>
            </div>
          </div>

          {selected.stage !== 'Ended' && (() => {
            const quiet = daysQuiet(selected);
            const next = (selected.dates || []).filter(d => d.status === 'Upcoming' && d.date >= TODAY()).sort((a,b) => a.date.localeCompare(b.date))[0];
            return (
              <div className="bg-white border border-stone-200 rounded-lg p-3 mb-4 flex items-center justify-between gap-3">
                <div className="text-sm min-w-0">
                  {next ? (
                    <span className="text-emerald-800 font-medium">Next date {friendlyDay(next.date).toLowerCase()} — {next.location || 'venue TBC'}</span>
                  ) : quiet === null ? (
                    <span className="text-stone-500">No activity logged yet.</span>
                  ) : quiet === 0 ? (
                    <span className="text-stone-600">Contact logged today.</span>
                  ) : (
                    <span className={quiet >= 21 ? 'text-red-700' : quiet >= 7 ? 'text-amber-700' : 'text-stone-600'}>
                      Last activity {quiet} day{quiet === 1 ? '' : 's'} ago.
                    </span>
                  )}
                </div>
                <button onClick={markContactedToday}
                  className="shrink-0 flex items-center gap-1.5 text-sm font-medium text-stone-700 border border-stone-300 rounded-md px-2.5 py-1 hover:bg-stone-100">
                  <Check className="w-3.5 h-3.5" /> Contacted today
                </button>
              </div>
            );
          })()}

          <StatusPanel
            read={selected.coachRead || null}
            busy={coachBusy}
            error={coachError}
            onRefresh={refreshCoachRead}
          />

          <ProfileCard profile={selected.profile || emptyProfile()} onEdit={() => setShowProfileEdit(true)} />

          <PhotosSection
            photos={selected.photos || []}
            onView={setLightbox}
            profilePhotoId={selected.profilePhotoId}
            onAddFiles={addPhotosToSelected}
            onDelete={deletePhoto}
            onSetProfile={setProfilePhoto}
          />

          <ConversationSection
            summary={selected.chatSummary || ''}
            entries={selected.conversationLog || []}
            onAddFiles={addConversationFromFiles}
            onDelete={deleteConversationEntry}
            onSwap={swapConversationSpeakers}
            onClear={clearConversation}
          />

          {(selected.dateSuggestions || []).length > 0 && (
            <DateSuggestions
              suggestions={selected.dateSuggestions}
              onAccept={acceptDateSuggestion}
              onDismiss={dismissDateSuggestion}
            />
          )}

          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-semibold text-stone-700">Date history</h3>
            <button onClick={startAddDate} className="flex items-center gap-1.5 bg-stone-900 text-white px-3 py-1.5 rounded-md text-sm font-medium hover:bg-stone-800">
              <Plus className="w-3.5 h-3.5" /> Add date
            </button>
          </div>

          {sortedDates.length === 0 && (
            <p className="text-sm text-stone-500 py-6 text-center">No dates logged yet — still talking stage.</p>
          )}

          <div className="space-y-3">
            {sortedDates.map(d => {
              const isCancelled = d.status === 'Cancelled';
              const isNoShow = d.status === 'No show';
              const isUpcoming = d.status === 'Upcoming';
              const badgeLabel = isCancelled ? 'Cancelled' : isNoShow ? 'No show' : (labels[d.id] || '—');
              const avgD = overallAvg(d);
              return (
                <div key={d.id} className={`bg-white border border-stone-200 rounded-lg p-4 ${isCancelled || isNoShow ? 'opacity-70' : ''}`}>
                  <div className="flex items-start justify-between gap-3">
                    <div className="min-w-0">
                      <div className="flex items-center gap-2 flex-wrap">
                        <span className={`flex items-center gap-1 text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full ${
                          isCancelled ? 'bg-red-50 text-red-800' :
                          isNoShow ? 'bg-amber-50 text-amber-800' :
                          isUpcoming ? 'bg-emerald-50 text-emerald-800' :
                          'bg-stone-100 text-stone-600'
                        }`}>
                          {isCancelled && <Ban className="w-2.5 h-2.5" />}
                          {isNoShow && <UserX className="w-2.5 h-2.5" />}
                          {badgeLabel}
                        </span>
                      </div>
                      <div className="mt-1 flex items-center gap-1 text-sm text-stone-600">
                        <MapPin className="w-3.5 h-3.5 shrink-0" /><span>{d.location}</span>
                      </div>
                      {d.date && (
                        <div className="mt-0.5 flex items-center gap-1 text-sm text-stone-600">
                          <Calendar className="w-3.5 h-3.5 shrink-0" /><span>{d.date}</span>
                        </div>
                      )}
                      {d.venues && <p className="mt-2 text-sm text-stone-800">{d.venues}</p>}
                      {d.notes && <p className="mt-1 text-sm text-stone-500">{d.notes}</p>}
                      {avgD !== null && (
                        <div className="mt-2 flex items-center gap-1.5 text-sm font-semibold text-amber-600">
                          <Star className="w-3.5 h-3.5 fill-amber-500 text-amber-500" /> {avgD.toFixed(1)}
                        </div>
                      )}
                      {d.outcome && <p className="mt-1 text-xs text-stone-600">{d.outcome}</p>}
                    </div>
                    <div className="flex flex-col gap-1 shrink-0">
                      <button onClick={() => startEditDate(d)} className="p-1.5 text-stone-500 hover:text-stone-900 rounded focus:outline-none focus:ring-2 focus:ring-stone-900">
                        <Pencil className="w-4 h-4" />
                      </button>
                      <button onClick={() => removeDate(d.id)} className="p-1.5 text-stone-500 hover:text-red-700 rounded focus:outline-none focus:ring-2 focus:ring-stone-900">
                        <Trash2 className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {showProfileEdit && (
          <ProfileEditModal
            profile={selected.profile || emptyProfile()}
            onCancel={() => setShowProfileEdit(false)}
            onSave={saveProfileDetails}
          />
        )}
        {lightbox && <Lightbox photo={lightbox} onClose={() => setLightbox(null)} />}
        {syncConflict && (
        <SyncConflictModal
          info={syncConflict}
          onKeepLocal={() => resolveConflict(false)}
          onTakeRemote={() => resolveConflict(true)}
        />
      )}
      {notice && <NoticeToast message={notice} onClose={() => setNotice('')} />}
        {dateConfirm && (
          <ChatDateConfirmModal
            info={dateConfirm}
            onCancel={() => setDateConfirm(null)}
            onConfirm={date => commitConversation(dateConfirm.payload, dateConfirm.targetId, date)}
          />
        )}
        {chatImport && (
          <ChatMismatchModal
            info={chatImport}
            currentName={selected.name}
            onCancel={() => setChatImport(null)}
            onConfirm={targetId => stageConversation(chatImport.payload, targetId)}
          />
        )}
        {showDateForm && (
          <DateFormModal
            form={dateForm} setForm={setDateForm} isNew={dateEditId === 'new'}
            onCancel={cancelDateForm} onSave={saveDateForm}
          />
        )}
        {showPersonForm && (
          <PersonFormModal
            form={personForm} setForm={setPersonForm} isNew={personEditId === 'new'}
            onCancel={cancelPersonForm} onSave={savePersonForm} knownChannels={knownChannels}
          />
        )}
        {error && <ErrorToast message={error} />}
      </div>
    );
  }

  // ---------- List view ----------
  return (
    <div className="min-h-screen bg-stone-100 text-stone-900">
      <div className="max-w-2xl mx-auto px-4 py-8">
        <header className="flex items-center justify-between mb-6">
          <div className="flex items-center gap-2">
            <Heart className="w-5 h-5 text-red-700" strokeWidth={1.75} />
            <h1 className="text-2xl font-serif tracking-tight">Relationship Tracker</h1>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={() => setShowSettings(true)} className="p-2 border border-stone-300 text-stone-700 rounded-md hover:bg-stone-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-stone-900" aria-label="Settings">
              <Settings className="w-4 h-4" />
            </button>
            <button onClick={() => setShowChatImport(true)} className="p-2 border border-stone-300 text-stone-700 rounded-md hover:bg-stone-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-stone-900" aria-label="Import chats">
              <MessageCircle className="w-4 h-4" />
            </button>
            <button onClick={() => setShowProfileImport(true)} className="flex items-center gap-1.5 border border-stone-300 text-stone-700 px-3 py-2 rounded-md text-sm font-medium hover:bg-stone-100 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-stone-900">
              <Camera className="w-4 h-4" /> Import profile
            </button>
            <button onClick={startAddPerson} className="flex items-center gap-1.5 bg-stone-900 text-white px-3 py-2 rounded-md text-sm font-medium hover:bg-stone-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-stone-900">
              <Plus className="w-4 h-4" /> Add person
            </button>
          </div>
        </header>

        {error && (
          <div className="mb-4 text-sm text-red-800 bg-red-50 border border-red-200 rounded-md px-3 py-2">{error}</div>
        )}

        {loading && <p className="text-sm text-stone-500">Loading…</p>}

        {!loading && upcoming.length > 0 && (
          <div className="mb-5 bg-white border border-emerald-200 rounded-lg overflow-hidden">
            <div className="px-4 py-2 bg-emerald-50 border-b border-emerald-200 flex items-center gap-1.5">
              <Calendar className="w-3.5 h-3.5 text-emerald-800" />
              <span className="text-xs font-semibold uppercase tracking-wide text-emerald-800">Coming up</span>
            </div>
            <div className="divide-y divide-stone-100">
              {upcoming.slice(0, 4).map(u => (
                <button key={u.date.id} onClick={() => setSelectedId(u.person.id)}
                  className="w-full text-left px-4 py-3 hover:bg-stone-50 flex items-center justify-between gap-3">
                  <div className="min-w-0">
                    <div className="font-semibold text-sm">{u.person.name}</div>
                    <div className="text-sm text-stone-600 flex items-center gap-1 mt-0.5">
                      <MapPin className="w-3.5 h-3.5 shrink-0" /><span className="truncate">{u.date.location || 'No venue set'}</span>
                    </div>
                  </div>
                  <div className="text-right shrink-0">
                    <div className="text-sm font-semibold text-emerald-800">{friendlyDay(u.date.date)}</div>
                    <div className="text-xs text-stone-500">{u.daysAway === 0 ? 'today' : 'in ' + u.daysAway + 'd'}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>
        )}

        {backupNag && (
          <div className="mb-4 bg-amber-50 border border-amber-200 rounded-lg px-3 py-2 flex items-center justify-between gap-3">
            <p className="text-sm text-amber-900">
              No backup in a while. Saved data is tied to this file only.
            </p>
            <button onClick={() => setShowSettings(true)}
              className="shrink-0 text-sm font-medium text-amber-900 underline">Back up</button>
          </div>
        )}

        {!loading && people.length > 0 && (
          <div className="mb-4 space-y-2">
            <input
              type="text" value={query} onChange={e => setQuery(e.target.value)}
              placeholder="Search name or channel…"
              className="w-full border border-stone-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-900"
            />
            <div className="flex gap-1.5 flex-wrap">
              {['Active', ...STAGES, 'All'].map(f => (
                <button key={f} onClick={() => setStageFilter(f)}
                  className={`text-xs px-2.5 py-1 rounded-full border ${
                    stageFilter === f ? 'bg-stone-900 text-white border-stone-900' : 'bg-white text-stone-600 border-stone-300 hover:bg-stone-50'
                  }`}>
                  {f}
                </button>
              ))}
              <button onClick={() => setShowInsights(true)}
                className="text-xs px-2.5 py-1 rounded-full border border-stone-300 bg-white text-stone-600 hover:bg-stone-50 ml-auto">
                Insights
              </button>
            </div>
          </div>
        )}

        {!loading && people.length > 0 && visiblePeople.length === 0 && (
          <p className="text-sm text-stone-500 py-10 text-center">Nothing matches that filter.</p>
        )}

        {!loading && sortedPeople.length === 0 && (
          <div className="py-12 text-stone-500">
            <div className="text-center">
              <p className="mb-1">No one logged yet.</p>
              <p className="text-sm">Tap "Add person" — even just talking stage counts.</p>
            </div>
            <div className="mt-6 bg-amber-50 border border-amber-200 rounded-lg p-3 text-left">
              <p className="text-sm text-amber-900 font-medium">Expecting to see people here?</p>
              <p className="text-sm text-amber-900 mt-1">
                Chrome ties saved data to the exact file it was opened from. A newly downloaded copy starts empty —
                nothing is lost, it's still held against the old copy.
              </p>
              <p className="text-sm text-amber-900 mt-1">
                Open your previous download, use Settings → Export backup, then come back here and Import it.
              </p>
              <button onClick={() => setShowSettings(true)}
                className="mt-2 text-sm font-medium text-amber-900 underline">
                Open Settings to import
              </button>
            </div>
          </div>
        )}

        <div className="space-y-3">
          {visiblePeople.map(p => {
            const avg = personAvg(p);
            const quiet = p.stage !== 'Ended' ? daysQuiet(p) : null;
            const hasUpcoming = (p.dates || []).some(d => d.status === 'Upcoming' && d.date >= TODAY());
            const completedCount = (p.dates || []).filter(d => d.status === 'Completed').length;
            const avatar = (p.photos || []).find(ph => ph.id === p.profilePhotoId) || (p.photos || [])[0];
            return (
              <button
                key={p.id}
                onClick={() => setSelectedId(p.id)}
                className={`w-full text-left bg-white border border-stone-200 rounded-lg p-4 hover:border-stone-300 transition-colors ${p.stage === 'Ended' ? 'opacity-70' : ''}`}
              >
                <div className="flex items-start justify-between gap-3">
                  <div className="flex items-start gap-3 min-w-0">
                    {avatar && (
                      <img src={avatar.thumb || avatar.dataUrl} alt="" className="w-11 h-11 rounded-full object-cover border border-stone-200 shrink-0" />
                    )}
                    <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap">
                      <h2 className="font-semibold text-base">{p.name}</h2>
                      <span className={`text-[10px] uppercase tracking-wide px-2 py-0.5 rounded-full ${stageBadgeClass[p.stage]}`}>
                        {p.stage}
                      </span>
                    </div>
                    <div className="mt-1 text-sm text-stone-600 flex flex-wrap gap-x-3 gap-y-0.5">
                      {p.meetingChannel && <span className="flex items-center gap-1"><MessageCircle className="w-3.5 h-3.5" />{p.meetingChannel}</span>}
                      {p.dateMet && <span className="flex items-center gap-1"><Calendar className="w-3.5 h-3.5" />Matched {p.dateMet}</span>}
                    </div>
                    <div className="mt-1 flex items-center gap-3 text-sm">
                      <span className="text-stone-500">{completedCount} date{completedCount === 1 ? '' : 's'}</span>
                      {activityRank(p) && <span className="text-stone-400">Active {friendlyDay(activityRank(p)).toLowerCase()}</span>}
                      {avg !== null && (
                        <span className="flex items-center gap-1 font-semibold text-amber-600">
                          <Star className="w-3.5 h-3.5 fill-amber-500 text-amber-500" />{avg.toFixed(1)}
                        </span>
                      )}
                    </div>
                    {quiet !== null && quiet >= 7 && !hasUpcoming && (
                      <div className={`mt-1 flex items-center gap-1 text-xs ${quiet >= 21 ? 'text-red-700' : 'text-amber-700'}`}>
                        <MessageCircle className="w-3 h-3" />No contact logged in {quiet} days
                      </div>
                    )}
                    {p.stage === 'Ended' && p.endReason && (
                      <div className="mt-1 flex items-center gap-1 text-xs text-stone-500"><Flag className="w-3 h-3" />{p.endReason}</div>
                    )}
                    </div>
                  </div>
                  <ChevronRight className="w-4 h-4 text-stone-400 shrink-0 mt-1" />
                </div>

                {p.coachRead && p.stage !== 'Ended' && (
                  <div className="mt-3 pt-3 border-t border-stone-100">
                    <div className="flex items-center gap-2 flex-wrap">
                      {p.coachRead.vibe && (
                        <span className="text-[10px] uppercase tracking-wide bg-stone-900 text-white rounded-full px-2 py-0.5">
                          {p.coachRead.vibe}
                        </span>
                      )}
                      {readIsStale(p) && (
                        <span className="text-[10px] uppercase tracking-wide text-amber-700">Read out of date</span>
                      )}
                    </div>
                    {briefNextStep(p.coachRead) && (
                      <p className="mt-1.5 text-sm text-stone-700">
                        <span className="text-stone-400">Next: </span>{briefNextStep(p.coachRead)}
                      </p>
                    )}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>

      {showPersonForm && (
        <PersonFormModal
          form={personForm} setForm={setPersonForm} isNew={personEditId === 'new'}
          onCancel={cancelPersonForm} onSave={savePersonForm} knownChannels={knownChannels}
        />
      )}
      {showProfileImport && (
        <ProfileImportModal
          onCancel={() => setShowProfileImport(false)}
          onCreate={handleCreateFromImport}
          onOverwrite={handleOverwriteFromImport}
          existingPeople={people}
          knownChannels={knownChannels}
        />
      )}
      {showChatImport && (
        <ChatImportModal
          people={people}
          onCommit={(payload, targetId, date) => commitConversation(payload, targetId, date)}
          onCreatePerson={createPersonForChat}
          onClose={(results) => {
            setShowChatImport(false);
            if (results && results.length) setNotice(results.length + ' chat' + (results.length === 1 ? '' : 's') + ' imported.');
          }}
        />
      )}
      {notice && <NoticeToast message={notice} onClose={() => setNotice('')} />}
      {showInsights && (
        <InsightsModal people={people} onClose={() => setShowInsights(false)} />
      )}
      {showSettings && (
        <SettingsModal
          onClose={() => setShowSettings(false)}
          people={people}
          onImportData={async (imported) => { await persist(imported); }}
        />
      )}
    </div>
  );
}

function ScreenshotImport({ prompt, onExtracted, label }) {
  const [status, setStatus] = useState('idle'); // idle | loading | done | error
  const [errMsg, setErrMsg] = useState('');
  const inputRef = React.useRef(null);

  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setStatus('loading');
    setErrMsg('');
    try {
      const fields = await extractFromScreenshot(file, prompt);
      onExtracted(fields);
      setStatus('done');
      setTimeout(() => setStatus('idle'), 2500);
    } catch (err) {
      setStatus('error');
      setErrMsg(friendlyExtractError(err) || 'Could not read that screenshot — try a clearer one, or fill in manually.');
    }
  }

  return (
    <div className="border border-dashed border-stone-300 rounded-md p-3 bg-stone-50">
      <button
        type="button"
        onClick={() => inputRef.current && inputRef.current.click()}
        disabled={status === 'loading'}
        className="w-full flex items-center justify-center gap-2 text-sm font-medium text-stone-700 py-1 disabled:opacity-60"
      >
        <Camera className="w-4 h-4" />
        {status === 'loading' ? 'Reading screenshot…' : label}
      </button>
      <input ref={inputRef} type="file" accept="image/*" className="hidden" onChange={handleFile} />
      {status === 'done' && <p className="text-xs text-emerald-700 text-center mt-1">Filled in below — check it over.</p>}
      {status === 'error' && <p className="text-xs text-red-700 text-center mt-1">{errMsg}</p>}
      <p className="text-xs text-stone-400 text-center mt-1">The image itself isn't saved — only the fields you keep, stored on this device.</p>
    </div>
  );
}

function formatDayLabel(iso) {
  const diff = daysBetween(iso, TODAY());
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
}

function groupPointsByDate(points) {
  const groups = [];
  (points || []).forEach(p => {
    const last = groups[groups.length - 1];
    if (last && last.date === (p.date || null)) last.points.push(p);
    else groups.push({ date: p.date || null, points: [p] });
  });
  return groups;
}

function ProfileImportModal({ onCancel, onCreate, onOverwrite, existingPeople, knownChannels }) {
  const [phase, setPhase] = useState('upload'); // upload | choose | loading | review | error
  const [errMsg, setErrMsg] = useState('');
  const [progress, setProgress] = useState('');
  const [photos, setPhotos] = useState([]);
  const [profilePhotoId, setProfilePhotoId] = useState(null);
  const [profile, setProfile] = useState(emptyProfile());
  const [form, setForm] = useState(emptyPersonForm);
  const [queue, setQueue] = useState([]);      // one file per person, worked through in turn
  const [qIndex, setQIndex] = useState(0);
  const [pending, setPending] = useState([]);  // files awaiting the separate/one-profile choice
  const [dupe, setDupe] = useState(null);      // { match, record, more }
  const inputRef = React.useRef(null);

  function resetDraft() {
    setPhotos([]);
    setProfilePhotoId(null);
    setProfile(emptyProfile());
    setForm(emptyPersonForm);
    setErrMsg('');
  }

  async function runOn(files, label) {
    setPhase('loading');
    setErrMsg('');
    setProgress(label || 'Slicing screenshot…');
    try {
      const { draft, name, photos: extractedPhotos } = await runProfileExtraction(files, setProgress);
      setProfile(draft);
      setForm(f => ({ ...emptyPersonForm, ...f, name: name || '' }));
      setPhotos(extractedPhotos);
      setProfilePhotoId(extractedPhotos[0]?.id || null);
      setPhase('review');
    } catch (err) {
      const msg = String(err && err.message || err);
      setErrMsg(friendlyExtractError(err)
        || (/memory|allocat|decode|canvas/i.test(msg)
            ? 'That image was too large for the browser to process. Try splitting the screenshot into two shorter ones.'
            : 'Could not read that screenshot — ' + msg));
      setPhase('error');
    }
  }

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    resetDraft();
    if (files.length > 1) {
      setPending(files);
      setPhase('choose');
      return;
    }
    setQueue([]);
    setQIndex(0);
    runOn(files);
  }

  function chooseSeparate() {
    setQueue(pending);
    setQIndex(0);
    runOn([pending[0]], 'Reading profile 1 of ' + pending.length + '…');
  }

  function chooseSingle() {
    setQueue([]);
    setQIndex(0);
    runOn(pending);
  }

  function advance(fromIndex) {
    const next = fromIndex + 1;
    if (next >= queue.length) { onCancel(); return; }
    resetDraft();
    setQIndex(next);
    runOn([queue[next]], 'Reading profile ' + (next + 1) + ' of ' + queue.length + '…');
  }

  function dropPrompt(i) {
    setProfile(p => ({ ...p, prompts: (p.prompts || []).filter((_, n) => n !== i) }));
  }

  function dropInterest(i) {
    setProfile(p => ({ ...p, interests: (p.interests || []).filter((_, n) => n !== i) }));
  }

  function removePhoto(id) {
    setPhotos(p => p.filter(ph => ph.id !== id));
    if (profilePhotoId === id) setProfilePhotoId(null);
  }

  function buildRecord() {
    const more = queue.length > 0 && qIndex < queue.length - 1;
    const chosenId = profilePhotoId || (photos[0]?.id || null);
    const trimmed = photos.map(ph => {
      const { fullDataUrl, ...rest } = ph;
      // Full resolution is retained for the profile shot only; the rest are
      // stored at viewing size to keep the file small.
      return ph.id === chosenId && fullDataUrl ? { ...rest, dataUrl: fullDataUrl } : rest;
    });
    return { record: newPersonRecord({ ...form, profile, photos: trimmed, profilePhotoId: chosenId }), more };
  }

  function handleCreate() {
    if (!form.name.trim()) { setErrMsg('Name is required.'); return; }
    const { record, more } = buildRecord();
    const match = (existingPeople || []).find(p => nameSimilarity(p.name, record.name) >= 0.9);
    if (match) { setDupe({ match, record, more }); return; }
    finish(record, more, null);
  }

  function finish(record, more, overwriteId) {
    if (overwriteId) onOverwrite(overwriteId, record, more);
    else onCreate(record, more);
    setDupe(null);
    if (more) advance(qIndex);
    else if (overwriteId) onCancel();
  }

  return (
    <div className="fixed inset-0 bg-black/70 z-50 overflow-y-auto p-0 sm:p-4 sm:flex sm:items-center sm:justify-center">
      <div className="bg-white w-full sm:max-w-md sm:rounded-lg rounded-t-lg shadow-2xl mt-8 sm:mt-0 mb-8 sm:mb-0 mx-auto">
        <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200 sticky top-0 bg-white rounded-t-lg">
          <h3 className="font-serif text-lg">
            Import profile{queue.length > 1 ? ` (${qIndex + 1} of ${queue.length})` : ''}
          </h3>
          <button onClick={onCancel} className="p-1 text-stone-500 hover:text-stone-900"><X className="w-5 h-5" /></button>
        </div>
        <div className="p-4 pb-32 space-y-3">
          <input ref={inputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />
          {phase === 'upload' && (
            <div className="border border-dashed border-stone-300 rounded-md p-6 bg-stone-50 text-center">
              <Camera className="w-6 h-6 mx-auto text-stone-400 mb-2" />
              <button type="button" onClick={() => inputRef.current && inputRef.current.click()} className="text-sm font-medium text-stone-700">
                Upload profile screenshot(s)
              </button>
              <p className="text-xs text-stone-400 mt-2">A tall scrolling screenshot works fine. Select several at once — you'll be asked whether they're separate people or parts of one profile.</p>
            </div>
          )}
          {phase === 'choose' && (
            <div className="space-y-3">
              <p className="text-sm text-stone-700">{pending.length} images selected. What are they?</p>
              <button onClick={chooseSeparate}
                className="w-full text-left border border-stone-300 rounded-md p-3 hover:bg-stone-50">
                <div className="text-sm font-medium">{pending.length} separate people</div>

function ChatImportModal({ people, onCommit, onCreatePerson, onClose }) {
  const [phase, setPhase] = useState('upload'); // upload | loading | review | error
  const [progress, setProgress] = useState('');
  const [errMsg, setErrMsg] = useState('');
  const [queue, setQueue] = useState([]);
  const [qIndex, setQIndex] = useState(0);
  const [payload, setPayload] = useState(null);
  const [mode, setMode] = useState('existing');   // existing | new
  const [personId, setPersonId] = useState('');
  const [newName, setNewName] = useState('');
  const [dateValue, setDateValue] = useState(TODAY());
  const [results, setResults] = useState([]);
  const inputRef = React.useRef(null);

  async function process(files, i) {
    setPhase('loading');
    setErrMsg('');
    setProgress('Reading chat ' + (i + 1) + ' of ' + files.length + '…');
    try {
      const p = await extractChatPayload([files[i]], setProgress);
      const match = p.contactName
        ? people.map(x => ({ x, score: nameSimilarity(p.contactName, x.name) }))
            .filter(x => x.score >= 0.8).sort((a, b) => b.score - a.score)[0]
        : null;
      setPayload(p);
      setMode(match ? 'existing' : 'new');
      setPersonId(match ? match.x.id : (people[0] ? people[0].id : ''));
      setNewName(p.contactName || '');
      setDateValue(TODAY());
      setPhase('review');
    } catch (err) {
      setErrMsg(friendlyExtractError(err) || 'Could not read that screenshot — ' + String(err && err.message || err));
      setPhase('error');
    }
  }

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    setQueue(files);
    setQIndex(0);
    setResults([]);
    process(files, 0);
  }

  function next(from, note) {
    const results2 = note ? [...results, note] : results;
    setResults(results2);
    const n = from + 1;
    if (n >= queue.length) { onClose(results2); return; }
    setQIndex(n);
    process(queue, n);
  }

  async function confirm() {
    let targetId = personId;
    let label = '';
    if (mode === 'new') {
      if (!newName.trim()) { setErrMsg('Give her a name first.'); return; }
      targetId = await onCreatePerson(newName.trim(), payload);
      label = newName.trim() + ' (new)';
    } else {
      if (!targetId) { setErrMsg('Pick who this chat is with.'); return; }
      label = (people.find(p => p.id === targetId) || {}).name || '';
    }
    setPhase('loading');
    setProgress('Saving…');
    const res = await onCommit(payload, targetId, payload.needsDate ? dateValue : null);
    next(qIndex, label + ' — ' + res.added + ' line' + (res.added === 1 ? '' : 's')
      + (res.dropped ? ', ' + res.dropped + ' duplicate' + (res.dropped === 1 ? '' : 's') + ' skipped' : ''));
  }

  const selectCls = "w-full border border-stone-300 rounded-md px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-stone-900";

  return (
    <div className="fixed inset-0 bg-black/70 z-50 overflow-y-auto p-0 sm:p-4 sm:flex sm:items-center sm:justify-center">
      <div className="bg-white w-full sm:max-w-md sm:rounded-lg rounded-t-lg shadow-2xl mt-8 sm:mt-0 mb-8 sm:mb-0 mx-auto">
        <div className="flex items-center justify-between px-4 py-3 border-b border-stone-200 sticky top-0 bg-white rounded-t-lg">
          <h3 className="font-serif text-lg">
            Import chats{queue.length > 1 ? ` (${qIndex + 1} of ${queue.length})` : ''}
          </h3>
          <button onClick={() => onClose(results)} className="p-1 text-stone-500 hover:text-stone-900"><X className="w-5 h-5" /></button>
        </div>

        <div className="p-4 pb-28 space-y-3">
          <input ref={inputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleFiles} />

          {phase === 'upload' && (
            <div className="border border-dashed border-stone-300 rounded-md p-6 bg-stone-50 text-center">
              <MessageCircle className="w-6 h-6 mx-auto text-stone-400 mb-2" />
              <button type="button" onClick={() => inputRef.current && inputRef.current.click()} className="text-sm font-medium text-stone-700">
                Upload chat screenshots
              </button>
              <p className="text-xs text-stone-400 mt-2">Select several at once — each one is treated as a separate conversation and you say who it belongs to.</p>
            </div>
          )}

          {phase === 'loading' && (
            <p className="text-sm text-stone-600 text-center py-8">{progress || 'Reading…'}</p>
          )}

          {phase === 'error' && (
            <div>
              <p className="text-sm text-red-700 text-center py-4">{errMsg}</p>
              <button type="button" onClick={() => next(qIndex, null)} className="block mx-auto text-sm font-medium text-stone-700">
                {qIndex < queue.length - 1 ? 'Skip to the next one' : 'Close'}
              </button>
            </div>
          )}

          {phase === 'review' && payload && (
            <>
              <div className="border border-stone-200 rounded-md p-3 bg-stone-50">
                <div className="text-sm">
                  <strong>{payload.contactName || 'No name found'}</strong>
                  {payload.appName ? ' · ' + payload.appName : ''}
                </div>
                <div className="text-xs text-stone-500 mt-0.5">
                  {payload.points.length} line{payload.points.length === 1 ? '' : 's'} read
                  {payload.matchedDate ? ' · matched ' + payload.matchedDate : ''}
                </div>
                {payload.summary && <p className="text-sm text-stone-700 mt-1.5">{payload.summary}</p>}
                {payload.lowConfidence && (
                  <p className="text-xs text-amber-700 mt-1.5">Who-said-what was unclear here — check it after saving and use Swap if it's reversed.</p>
                )}
              </div>

              {errMsg && <p className="text-sm text-red-700">{errMsg}</p>}

              <div className="flex gap-1.5">
                <button onClick={() => setMode('existing')} disabled={!people.length}
                  className={`flex-1 text-sm rounded-md py-2 border ${mode === 'existing' ? 'bg-stone-900 text-white border-stone-900' : 'border-stone-300 text-stone-700'} disabled:opacity-40`}>
                  Existing person
                </button>
                <button onClick={() => setMode('new')}
                  className={`flex-1 text-sm rounded-md py-2 border ${mode === 'new' ? 'bg-stone-900 text-white border-stone-900' : 'border-stone-300 text-stone-700'}`}>
                  New person
                </button>
              </div>

              {mode === 'existing' ? (
                <Field label="File this chat under">
                  <select value={personId} onChange={e => setPersonId(e.target.value)} className={selectCls}>
                    {people.map(p => <option key={p.id} value={p.id}>{p.name}{p.stage === 'Ended' ? ' (ended)' : ''}</option>)}
                  </select>
                </Field>
              ) : (
                <>
                  <Field label="Name">
                    <input value={newName} onChange={e => setNewName(e.target.value)} onFocus={focusScroll} style={fieldScrollMargin} className={selectCls} />
                  </Field>
                  <p className="text-xs text-stone-500">
                    Created at talking stage with no profile
                    {payload.appName ? ` — recorded as ${payload.appName}.` : ' — recorded as met in person. Import a profile later to change that.'}
                  </p>
                </>
              )}

              {payload.needsDate && (
                <Field label="Date of these messages" hint={payload.markers.length ? 'Chat shows ' + payload.markers.join(', ') : 'No dated divider found'}>
                  <input type="date" value={dateValue} onChange={e => setDateValue(e.target.value)} className={selectCls} />
                </Field>
              )}

              {results.length > 0 && (
                <div className="text-xs text-stone-400 border-t border-stone-100 pt-2">
                  Done so far: {results.join(' · ')}
                </div>
              )}
            </>
          )}
        </div>

        <div className="flex gap-2 px-4 py-3 border-t border-stone-200 sticky bottom-0 bg-white rounded-b-lg">
          <button onClick={() => onClose(results)} className="flex-1 border border-stone-300 rounded-md py-2 text-sm font-medium hover:bg-stone-100">
            {phase === 'review' ? 'Stop' : 'Close'}
          </button>
          {phase === 'review' && (
            <>
              {queue.length > 1 && qIndex < queue.length - 1 && (
                <button onClick={() => next(qIndex, null)} className="flex-1 border border-stone-300 rounded-md py-2 text-sm font-medium hover:bg-stone-100">Skip</button>
              )}
              <button onClick={confirm} className="flex-1 flex items-center justify-center gap-1.5 bg-stone-900 text-white rounded-md py-2 text-sm font-medium hover:bg-stone-800">
                <Check className="w-4 h-4" /> {queue.length > 1 && qIndex < queue.length - 1 ? 'Save & next' : 'Save'}
              </button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function SyncPanel({ syncState, onConnect, onDisconnect, onSyncNow }) {
  const [token, setToken] = useState('');
  const [busy, setBusy] = useState(false);
  const connected = syncState.status !== 'off';

  async function connect() {
    if (!token.trim()) return;
    setBusy(true);
    await onConnect(token.trim());
    setBusy(false);
    setToken('');
  }

  return (
    <div className="mt-6 pt-4 border-t border-stone-200">
      <h4 className="text-sm font-semibold text-stone-700 mb-1">Sync across devices</h4>
      {!connected ? (
        <>
          <p className="text-xs text-stone-500 mb-2">
            Paste a GitHub personal access token with the <strong>gist</strong> permission. Your data is kept in one
            private Gist that only your token can reach, and every save is a restorable version.
          </p>
          <input
            type="password" value={token} onChange={e => setToken(e.target.value)}
            placeholder="github_pat_… or ghp_…"
            className="w-full border border-stone-300 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-stone-900"
          />
          <button onClick={connect} disabled={busy || !token.trim()}
            className="mt-2 w-full bg-stone-900 text-white rounded-md py-2 text-sm font-medium hover:bg-stone-800 disabled:opacity-50">
            {busy ? 'Connecting…' : 'Turn on sync'}
          </button>
        </>
      ) : (
        <>
          <div className="flex items-center gap-2 text-sm">
            <span className={`w-2 h-2 rounded-full ${
              syncState.status === 'error' ? 'bg-red-600' : syncState.status === 'syncing' ? 'bg-amber-500' : 'bg-emerald-600'
            }`} />
            <span className="text-stone-700">
              {syncState.status === 'error' ? 'Sync problem'
                : syncState.status === 'syncing' ? 'Syncing…'
                : syncState.last ? 'Synced ' + new Date(syncState.last).toLocaleString()
                : 'Connected'}
            </span>
          </div>
          {syncState.error && <p className="text-xs text-red-700 mt-1">{syncState.error}</p>}
          <div className="flex gap-2 mt-2">
            <button onClick={onSyncNow}
              className="flex-1 border border-stone-300 rounded-md py-2 text-sm font-medium hover:bg-stone-100">Sync now</button>
            <button onClick={onDisconnect}
              className="flex-1 border border-stone-300 rounded-md py-2 text-sm font-medium hover:bg-stone-100">Turn off here</button>
          </div>
          <p className="text-[11px] text-stone-400 mt-1">Changes upload a few seconds after you make them, and download when the app opens.</p>
        </>
      )}
    </div>
  );
}

// ---------- Insights ----------

function InsightsModal({ people, onClose }) {
  const stats = useMemo(() => {
    const allDates = [];
    people.forEach(p => (p.dates || []).forEach(d => allDates.push({ ...d, person: p })));
    const completed = allDates.filter(d => d.status === 'Completed');
    const cancelled = allDates.filter(d => d.status === 'Cancelled' || d.status === 'No show');

    // Per-channel funnel
    const channels = {};
    people.forEach(p => {
      const key = p.meetingChannel || 'Unrecorded';
      if (!channels[key]) channels[key] = { people: 0, dates: 0, secondDates: 0 };
      channels[key].people += 1;
      const done = (p.dates || []).filter(d => d.status === 'Completed').length;
      channels[key].dates += done;
      if (done >= 2) channels[key].secondDates += 1;
    });

    // Rating dimensions across all completed dates
    const dim = key => {
      const vals = completed.map(d => d[key]).filter(v => v > 0);
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
    };

    // Activity by month
    const months = {};
    completed.forEach(d => {
      if (!d.date) return;
      const m = d.date.slice(0, 7);
      months[m] = (months[m] || 0) + 1;
    });

    const endReasons = {};
    people.filter(p => p.stage === 'Ended').forEach(p => {
      const r = p.endReason || 'Unrecorded';
      endReasons[r] = (endReasons[r] || 0) + 1;
    });

    return {
      totalPeople: people.length,
      active: people.filter(p => p.stage !== 'Ended').length,
      completed: completed.length,
      cancelled: cancelled.length,
      firstDatesToSecond: (() => {
        const withOne = people.filter(p => (p.dates || []).filter(d => d.status === 'Completed').length >= 1).length;
        const withTwo = people.filter(p => (p.dates || []).filter(d => d.status === 'Completed').length >= 2).length;
        return withOne ? Math.round((withTwo / withOne) * 100) : null;
      })(),
      chemistry: dim('chemistry'), connection: dim('connection'), compatibility: dim('compatibility'),
      channels, months, endReasons,
    };
  }, [people]);

  const monthKeys = Object.keys(stats.months).sort().slice(-6);
  const maxMonth = Math.max(1, ...monthKeys.map(m => stats.months[m]));

  function Stat({ label, value, sub }) {
    return (
      <div className="bg-stone-50 border border-stone-200 rounded-md p-3">
        <div className="text-xl font-semibold">{value}</div>
        <div className="text-xs text-stone-600">{label}</div>
        {sub && <div className="text-[11px] text-stone-400 mt-0.5">{sub}</div>}
      </div>
    );
  }

  return (
    <div className="fixed inset-0 bg-black/40 flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
      <div className="bg-white w-full sm:max-w-lg rounded-t-2xl sm:rounded-lg max-h-[90vh] overflow-y-auto">
        <div className="sticky top-0 bg-white border-b border-stone-200 px-4 py-3 flex items-center justify-between">
          <h3 className="font-serif text-lg">Insights</h3>
          <button onClick={onClose} className="p-1.5 text-stone-500 hover:text-stone-900"><X className="w-4 h-4" /></button>
        </div>

        <div className="p-4 space-y-5">
          <div className="grid grid-cols-2 gap-2">
            <Stat label="People tracked" value={stats.totalPeople} sub={stats.active + ' active'} />
            <Stat label="Dates completed" value={stats.completed} sub={stats.cancelled ? stats.cancelled + ' cancelled / no show' : null} />
            <Stat label="First → second date" value={stats.firstDatesToSecond === null ? '—' : stats.firstDatesToSecond + '%'} sub="of people you met once" />
            <Stat label="Avg chemistry" value={stats.chemistry === null ? '—' : stats.chemistry.toFixed(1)} sub="across completed dates" />
          </div>

          {(stats.chemistry || stats.connection || stats.compatibility) && (
            <div>
              <h4 className="text-xs font-semibold uppercase tracking-wide text-stone-500 mb-2">What you rate highest</h4>
              <div className="space-y-1.5">
                {[['Chemistry', stats.chemistry], ['Connection', stats.connection], ['Compatibility', stats.compatibility]].map(([k, v]) => (
                  <div key={k} className="flex items-center gap-2">
                    <span className="text-sm text-stone-600 w-28 shrink-0">{k}</span>
                    <div className="flex-1 h-2 bg-stone-100 rounded-full overflow-hidden">
                      <div className="h-full bg-amber-400" style={{ width: ((v || 0) / 5 * 100) + '%' }} />
                    </div>
                    <span className="text-sm font-medium w-8 text-right">{v === null ? '—' : v.toFixed(1)}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {Object.keys(stats.channels).length > 0 && (
            <div>
              <h4 className="text-xs font-semibold uppercase tracking-wide text-stone-500 mb-2">Where they came from</h4>
              <table className="w-full text-sm">
                <thead>
                  <tr className="text-xs text-stone-500 text-left">
                    <th className="font-medium pb-1">Channel</th>
                    <th className="font-medium pb-1 text-right">People</th>
                    <th className="font-medium pb-1 text-right">Dates</th>

// ---------- Cross-device sync (private GitHub Gist) ----------
// The whole dataset is kept as one JSON file in a private Gist. A personal
// access token with the "gist" permission is all it needs — no server, and the
// Gist's own revision history doubles as versioned backups.

const GIST_FILE = 'relationship-tracker-data.json';
const GIST_TAG = 'relationship-tracker: private data store (do not edit by hand)';
const Sync = {
  token() {
    try {
      return localStorage.getItem('rt:gh-token') || '';
    } catch (e) {
      return '';
    }
  },
  gistId() {
    try {
      return localStorage.getItem('rt:gist-id') || '';
    } catch (e) {
      return '';
    }
  },
  lastPull() {
    try {
      return localStorage.getItem('rt:last-pull') || '';
    } catch (e) {
      return '';
    }
  },
  configured() {
    return !!this.token();
  },
  save(token, gistId) {
    try {
      localStorage.setItem('rt:gh-token', token);
      if (gistId) localStorage.setItem('rt:gist-id', gistId);
    } catch (e) {/* ignore */}
  },
  markPulled(stamp) {
    try {
      localStorage.setItem('rt:last-pull', stamp || '');
    } catch (e) {}
  },
  clear() {
    try {
      localStorage.removeItem('rt:gh-token');
      localStorage.removeItem('rt:gist-id');
      localStorage.removeItem('rt:last-pull');
    } catch (e) {/* ignore */}
  }

async function ghFetch(path, options) {
  const token = Sync.token();
  if (!token) throw new Error('No sync token set');
  const res = await fetch('https://api.github.com' + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json',
      ...(options && options.headers)
    }
  });
  if (res.status === 401) throw new Error('That token was rejected — check it was copied in full.');
  if (res.status === 403) throw new Error('GitHub refused the request. The token may lack the "gist" permission.');
  if (!res.ok) throw new Error('GitHub returned ' + res.status);
  return res.json();
}

// Find the app's existing gist for this account, or make one.
async function ghConnect() {
  const me = await ghFetch('/user');
  let id = Sync.gistId();
  if (!id) {
    const gists = await ghFetch('/gists?per_page=100');
    const found = (gists || []).find(g => g.description === GIST_TAG || g.files && g.files[GIST_FILE]);
    if (found) id = found.id;
  }
  if (!id) {
    const created = await ghFetch('/gists', {
      method: 'POST',
      body: JSON.stringify({
        description: GIST_TAG,
        public: false,
        files: {
          [GIST_FILE]: {
            content: JSON.stringify({
              updatedAt: '',
              people: []
            })
          }
        }
      })
    });
    id = created.id;
  }
  Sync.save(Sync.token(), id);
  return {
    login: me.login,
    gistId: id
  };
}
async function ghPull() {
  const id = Sync.gistId();
  if (!id) return null;
  const gist = await ghFetch('/gists/' + id);
  const file = gist.files && gist.files[GIST_FILE];
  if (!file) return null;
  let content = file.content;
  // Gists over ~1MB come back truncated, with the full copy at raw_url.
  if (file.truncated && file.raw_url) {
    const raw = await fetch(file.raw_url);
    if (!raw.ok) throw new Error('Could not download the full sync file.');
    content = await raw.text();
  }
  if (!content) return null;
  const parsed = JSON.parse(content);
  return {
    updatedAt: parsed.updatedAt || '',
    device: parsed.device || '',
    people: Array.isArray(parsed.people) ? parsed.people.map(backfillPerson) : []
  };
}

  const id = Sync.gistId();

  await ghFetch('/gists/' + id, {
    method: 'PATCH',
    body: JSON.stringify({
      files: {
        [GIST_FILE]: {
          content: JSON.stringify({
            updatedAt,
            device: deviceLabel(),

function deviceLabel() {
  const ua = navigator && navigator.userAgent || '';
  if (/Android/i.test(ua)) return 'Android phone';
  if (/iPhone|iPad/i.test(ua)) return 'iPhone/iPad';
  if (/Mac/i.test(ua)) return 'Mac';
  if (/Windows/i.test(ua)) return 'Windows PC';
  return 'this device';
}

// ---------- Storage adapter ----------
// Inside a Claude artifact, window.storage exists. Opened as a downloaded file
// in Chrome it does not — so fall back to IndexedDB (large capacity, needed for
// base64 photos), then localStorage, then memory as a last resort.

const DataStore = (() => {
  const hasArtifact = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
  const hasIDB = typeof indexedDB !== 'undefined';
  const DB_NAME = 'relationship-tracker',
    STORE = 'kv';
  const mem = {};
  function openDb() {
    return new Promise((res, rej) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        req.result.createObjectStore(STORE);
      };
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    });
  }
  function idbOp(mode, fn) {
    return openDb().then(db => new Promise((res, rej) => {
      const store = db.transaction(STORE, mode).objectStore(STORE);
      const req = fn(store);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }));
  }
  return {
    mode: hasArtifact ? 'artifact' : hasIDB ? 'device' : 'session',
    label: hasArtifact ? 'Claude artifact storage' : hasIDB ? 'this device (IndexedDB)' : 'this session only',
    async get(key) {
      if (hasArtifact) {
        try {
          return await window.storage.get(key, false);
        } catch (e) {
          return null;
        }
      }
      if (hasIDB) {
        try {
          const v = await idbOp('readonly', s => s.get(key));
          if (v !== undefined && v !== null) return {
            key,
            value: v
          };
        } catch (e) {/* fall through */}
      }
      try {
        const v = localStorage.getItem('rt:' + key);
        if (v !== null) return {
          key,
          value: v
        };
      } catch (e) {/* ignore */}
      return mem[key] !== undefined ? {
        key,
        value: mem[key]
      } : null;
    },
    async set(key, value) {
      mem[key] = value;
      if (hasArtifact) {
        try {
          return await window.storage.set(key, value, false);
        } catch (e) {
          return null;
        }
      }
      if (hasIDB) {
        try {
          await idbOp('readwrite', s => s.put(value, key));
          return {
            key,
            value
          };
        } catch (e) {/* fall through */}
      }
      try {
        localStorage.setItem('rt:' + key, value);
        return {
          key,
          value
        };
      } catch (e) {
        return null;
      }
    }
  };
})();

// ---------- Helpers ----------

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'];
  const v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}
function overallAvg(d) {
  const vals = [d.chemistry, d.connection, d.compatibility].filter(v => v > 0);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}
function personAvg(person) {
  const avgs = (person.dates || []).filter(d => d.status === 'Completed').map(overallAvg).filter(v => v !== null);
  if (avgs.length === 0) return null;
  return avgs.reduce((a, b) => a + b, 0) / avgs.length;
}
const TODAY = () => new Date().toISOString().slice(0, 10);
function daysBetween(isoA, isoB) {
  const a = new Date(isoA + 'T00:00:00'),
    b = new Date(isoB + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}

// Most recent real-world activity: explicit contact log, a conversation entry,
// a completed date, or falling back to the day you met.
function lastActivity(person) {
  const candidates = [person.lastContact, person.dateMet].concat((person.conversationLog || []).map(c => c.date)).concat((person.dates || []).filter(d => d.status !== 'Upcoming').map(d => d.date)).filter(Boolean);
  if (!candidates.length) return null;
  return candidates.sort().slice(-1)[0];
}

// The most recent thing to happen at all — a logged message, a date, a booked
// date coming up, or an explicit contact note. Used to order the home list.
function activityRank(person) {
  const dates = (person.dates || []).map(d => d.date).filter(Boolean);
  const candidates = [lastActivity(person), person.lastContact, ...dates].filter(Boolean);
  return candidates.sort().slice(-1)[0] || '';
}

// A read taken before the latest message or date no longer reflects reality.
function readIsStale(person) {
  const read = person.coachRead;
  if (!read || !read.generatedAt) return false;
  const latest = activityRank(person);
  return !!latest && latest > read.generatedAt;
}

// The recommendation trimmed to its first sentence, for the home card.
function briefNextStep(read) {
  if (!read || !read.recommendation) return '';
  const first = read.recommendation.split(/(?<=[.!?])\s+/)[0] || read.recommendation;
  return first.length > 120 ? first.slice(0, 117).trimEnd() + '…' : first;
}
function daysQuiet(person) {
  const last = lastActivity(person);
  if (!last) return null;
  return Math.max(0, daysBetween(last, TODAY()));
}

// Every upcoming date across everyone, soonest first.
function upcomingAcross(people) {
  const today = TODAY();
  const out = [];
  people.forEach(p => {
    (p.dates || []).forEach(d => {
      if (d.status === 'Upcoming' && d.date && d.date >= today) {
        out.push({
          person: p,
          date: d,
          daysAway: daysBetween(today, d.date)
        });
      }
    });
  });
  return out.sort((a, b) => a.date.date.localeCompare(b.date.date));
}
function friendlyDay(iso) {
  const n = daysBetween(TODAY(), iso);
  if (n === 0) return 'Today';
  if (n === 1) return 'Tomorrow';
  if (n < 7) return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, {
    weekday: 'long'
  });
  return new Date(iso + 'T00:00:00').toLocaleDateString(undefined, {
    weekday: 'short',
    day: 'numeric',
    month: 'short'
  });
}
function dateLabelsForPerson(person) {
  const map = {};
  const eligible = (person.dates || []).filter(d => d.status === 'Completed' || d.status === 'Upcoming');
  eligible.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  eligible.forEach((d, i) => {
    map[d.id] = ordinal(i + 1) + ' date';
  });
  return map;
}

// Migrate the old flat "dates-list" (one record per date event, with a name
// field) into person-centric records with nested date history.
function migrateFromFlatList(flat) {
  const groups = {};
  flat.forEach(d => {
    const key = (d.name || 'Unknown').trim();
    if (!groups[key]) groups[key] = [];
    const {
      name,
      rating,
      ...rest
    } = d;
    let chemistry = rest.chemistry,
      connection = rest.connection,
      compatibility = rest.compatibility;
    if (chemistry === undefined) {
      chemistry = rating || 0;
      connection = rating || 0;
      compatibility = rating || 0;
    }
    groups[key].push({
      ...rest,
      chemistry,
      connection,
      compatibility,
      status: d.status || 'Completed'
    });
  });
  return Object.entries(groups).map(([name, dates]) => {
    dates.sort((a, b) => (a.date || '').localeCompare(b.date || ''));
    return {
      id: 'p-' + name.toLowerCase().replace(/\s+/g, '-') + '-' + Date.now() + Math.random().toString(36).slice(2, 6),
      name,
      meetingChannel: '',
      dateMet: dates[0]?.date || '',
      stage: 'Dating',
      notes: '',
      endReason: '',
      endDate: '',
      endNotes: '',
      photos: [],
      profilePhotoId: null,
      conversationLog: [],
      dates
    };
  });
}

// Backfill fields added after initial release, for people saved by an earlier version.
function backfillPerson(p) {
  const out = {
    photos: [],
    profilePhotoId: null,
    conversationLog: [],
    phone: '',
    lastContact: '',
    dateSuggestions: [],
    dismissedDateKeys: [],
    ...p,
    profile: {
      ...emptyProfile(),
      ...(p.profile || {})
    }
  };
  // Older photos were single low-res thumbnails; keep them working.
  out.photos = (out.photos || []).map(ph => ({
    thumb: ph.thumb || ph.dataUrl,
    ...ph
  }));
  out.conversationLog = migrateConversationLog(out.conversationLog);
  return out;
}

// Earlier versions stored chat imports as entries containing split lists or a
// full transcript. Flatten them into the dated point timeline used now.
function migrateConversationLog(log) {
  const out = [];
  let n = 0;
  const add = (from, text, date, timeLabel) => {
    if (!text) return;
    n += 1;
    out.push({
      id: 'c-legacy-' + n + '-' + Math.random().toString(36).slice(2, 5),
      from,
      point: String(text).trim(),
      date: date || null,
      timeLabel: timeLabel || null
    });
  };
  (log || []).forEach(entry => {
    if (!entry) return;
    if (entry.point) {
      out.push({
        ...entry,
        from: entry.from === 'me' ? 'me' : 'she'
      });
      return;
    }
    const d = entry.date || null;
    (entry.messages || []).forEach(m => add(m.from === 'me' ? 'me' : 'she', m.text, m.date || d, m.timestamp));
    (entry.theySaid || []).forEach(t => add('she', t, d));
    (entry.iSaid || []).forEach(t => add('me', t, d));
    if (!entry.messages && !entry.theySaid && !entry.iSaid && entry.summary) add('she', entry.summary, d);
  });
  out.sort((a, b) => (a.date || '9999-12-31').localeCompare(b.date || '9999-12-31'));
  return out;
}
function profileIsEmpty(profile) {
  if (!profile) return true;
  const hasField = PROFILE_FIELDS.some(([k]) => profile[k]);

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('Could not load image'));
    img.src = url;
  });
}

// The vision API downsizes any image to roughly 1568px on its long edge. A tall
// scrolling screenshot therefore arrives unreadable. Slice it into panels that
// are close to square, each sent at full readable width, with a little overlap
// so nothing is lost across a cut.
const PANEL_MAX_ASPECT = 1.3; // height / width per panel
const PANEL_OVERLAP = 0.06; // fraction of panel height repeated
const PANEL_WIDTH_CAP = 1100; // px sent to the API — legible, and a third of the memory of 1400
const MAX_PANELS = 14;
function sliceImageToPanels(imgEl) {
  const W = imgEl.naturalWidth,
    H = imgEl.naturalHeight;
  const idealPanelH = W * PANEL_MAX_ASPECT;
  let count = Math.max(1, Math.ceil(H / idealPanelH));
  if (count > MAX_PANELS) count = MAX_PANELS;
  const step = H / count;
  const overlapPx = step * PANEL_OVERLAP;
  const panels = [];
  for (let i = 0; i < count; i++) {
    const sy = Math.max(0, i * step - (i > 0 ? overlapPx : 0));
    const sy2 = Math.min(H, (i + 1) * step + (i < count - 1 ? overlapPx : 0));
    const sh = sy2 - sy;
    // A 540px-wide phone capture is small for reading badge text. Scale up to
    // 2x where there is headroom, but never past the point where the API would
    // downscale it again (roughly 1568px on the long edge).
    const scale = Math.min(2, PANEL_WIDTH_CAP / W, 1500 / sh);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(W * scale));
    canvas.height = Math.max(1, Math.round(sh * scale));
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, sy, W, sh, 0, 0, canvas.width, canvas.height);
    const encoded = canvas.toDataURL('image/jpeg', 0.8).split(',')[1];
    canvas.width = 0;
    canvas.height = 0; // release the backing store immediately
    panels.push({
      index: i + 1,
      base64: encoded,
      y0: sy / H,
      y1: sy2 / H
    });
  }
  return panels;
}

// Crop a photo region at the source image's own resolution.
// Everything is kept at a modest viewing size to keep storage small. Only the
// photo picked as the profile shot at import time is also kept at full size.
const PHOTO_FULL_EDGE = 1600; // profile photo only
const PHOTO_VIEW_EDGE = 700; // normal stored size — fine on any phone screen
const THUMB_MAX_EDGE = 300; // grid thumbnails

function cropCanvas(imgEl, sx, sy, sw, sh, maxEdge, quality) {
  const scale = Math.min(1, maxEdge / Math.max(sw, sh));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(sw * scale));
  canvas.height = Math.max(1, Math.round(sh * scale));
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(imgEl, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

// region coords are fractions of a panel; convert to the full image and crop.
function cropPhotoFromPanel(imgEl, panel, region) {
  const W = imgEl.naturalWidth,
    H = imgEl.naturalHeight;
  const panelTop = panel.y0 * H,
    panelH = (panel.y1 - panel.y0) * H;
  const clamp01 = v => Math.min(1, Math.max(0, Number(v) || 0));
  const rx = clamp01(region.x),
    ry = clamp01(region.y);
  const rw = Math.min(1 - rx, Math.max(0, Number(region.width) || 0));
  const rh = Math.min(1 - ry, Math.max(0, Number(region.height) || 0));
  const sx = rx * W,
    sw = rw * W;
  const sy = panelTop + ry * panelH,
    sh = rh * panelH;
  if (sw < 40 || sh < 40) return null; // too small to be a real photo
  return {
    dataUrl: cropCanvas(imgEl, sx, sy, sw, sh, PHOTO_VIEW_EDGE, 0.82),
    fullDataUrl: cropCanvas(imgEl, sx, sy, sw, sh, PHOTO_FULL_EDGE, 0.88),
    thumb: cropCanvas(imgEl, sx, sy, sw, sh, THUMB_MAX_EDGE, 0.7),
    width: Math.round(sw),
    height: Math.round(sh)
  };
}
function approxBytes(dataUrl) {
  return dataUrl ? Math.round(dataUrl.length * 0.75) : 0;
}
function downloadDataUrl(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
